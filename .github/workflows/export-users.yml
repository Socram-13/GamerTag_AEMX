name: Exportar jugadores

on:
  schedule:
    - cron: '0 9 * * *'   # 1 vez al día (09:00 UTC = 03:00 CDMX)
  workflow_dispatch:       # también manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: export-users
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin@12
      - run: node .github/scripts/export-users.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/mictlan/users.json
          git diff --staged --quiet && exit 0
          git commit -m "Actualizar lista de jugadores"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Intento $i falló, reintentando..."
            sleep $((i*10))
          done
          exit 1
