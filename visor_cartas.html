<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Cartas AEMX</title>
<meta name="theme-color" content="#070a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a12;
    --panel:#131a26;
    --accent:#4fd1ff;
    --accent-2:#ff2bd6;
    --text:#e8f1ff;
    --muted:#8fa3c4;
    --font-display:'Orbitron', 'Segoe UI', system-ui, sans-serif;
    --font-body:'Share Tech Mono', 'Courier New', ui-monospace, monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    color:var(--text);
    min-height:100vh;
    padding:20px;
  }
  /* Fondo cyberpunk, 4 capas detrás del contenido (solo transform = ligero):
     html::before  brillos cian/magenta que derivan
     body::before  malla de hexágonos que avanza en bucle
     body::after   líneas de escaneo + viñeteado (estáticos)
     html::after   haz de escaneo que recorre la pantalla */
  body::before{
    content:"";
    position:fixed;
    left:0; right:0; top:-49px; bottom:0; /* margen >= alto del mosaico (48.5px) para el bucle */
    z-index:-1;
    pointer-events:none;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyOCIgaGVpZ2h0PSI0OC40OTc0IiB2aWV3Qm94PSIwIDAgMjggNDguNDk3NCI+PHBhdGggZD0iTTE0IC04LjA4MjlWOC4wODI5TDAgMTYuMTY1OEwtMTQgOC4wODI5TTQyIC04LjA4MjlWOC4wODI5TDI4IDE2LjE2NThMMTQgOC4wODI5TTE0IDQwLjQxNDVWNTYuNTgwM0wwIDY0LjY2MzJMLTE0IDU2LjU4MDNNNDIgNDAuNDE0NVY1Ni41ODAzTDI4IDY0LjY2MzJMMTQgNTYuNTgwM00yOCAxNi4xNjU4VjMyLjMzMTZMMTQgNDAuNDE0NUwwIDMyLjMzMTYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzRmZDFmZiIgc3Ryb2tlLW9wYWNpdHk9IjAuMTYiIHN0cm9rZS13aWR0aD0iMSIvPjwvc3ZnPg==");
    background-size:28px 48.4974px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 0%, transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 40%, #000 0%, transparent 78%);
    animation:hexMove 4s linear infinite;
    will-change:transform;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.65) 100%);
  }
  html::before{
    content:"";
    position:fixed;
    inset:-25%;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(45% 40% at 20% 15%, rgba(79,209,255,0.26) 0%, transparent 70%),
      radial-gradient(45% 45% at 85% 85%, rgba(255,43,214,0.22) 0%, transparent 70%),
      radial-gradient(35% 35% at 70% 25%, rgba(139,123,255,0.14) 0%, transparent 70%),
      linear-gradient(180deg, #0b1020 0%, var(--bg) 100%);
    animation:drift 22s ease-in-out infinite alternate;
    will-change:transform;
  }
  html::after{
    content:"";
    position:fixed;
    left:0; right:0; top:0;
    height:140px;
    z-index:-1;
    pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(79,209,255,0.08) 85%, rgba(120,235,255,0.55) 99%, rgba(120,235,255,0.15) 100%);
    transform:translate3d(0,-140px,0);
    animation:beam 10s linear infinite;
    will-change:transform;
  }
  h1{
    text-align:center;
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(1.2rem, 5vw, 2.1rem);
    letter-spacing:0.14em;
    white-space:nowrap;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
    margin-bottom:4px;
    color:#e6fbff; /* respaldo */
    background:linear-gradient(90deg, #ff1744, #ff9100, #ffea00, #00e676, #00e5ff, #2979ff, #d500f9, #ff1744);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:blur(0) drop-shadow(0 0 6px rgba(255,255,255,0.30)) drop-shadow(0 0 18px rgba(139,123,255,0.55));
    animation:
      titleIn 1.3s cubic-bezier(.2,.7,.2,1) backwards,
      rainbow 4s linear infinite,
      flicker 6s linear 1.8s infinite,
      glitch 7s linear 2.4s infinite;
  }
  #status{
    text-align:center;
    font-size:0.9rem;
    letter-spacing:0.04em;
    color:var(--muted);
    margin-bottom:10px;
    animation:fadeIn 0.8s ease-out 0.8s backwards;
  }
  #viewer{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action:none;
    min-height:80vh;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none; /* evita el menú "Guardar imagen" al mantener presionado en iOS */
  }
  .face img{
    -webkit-user-drag:none;
    user-drag:none;
    pointer-events:none; /* evita clic derecho / arrastre directo sobre la imagen */
  }
  .navRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
  }
  .navBtn{
    background:var(--panel);
    border:1px solid #24304a;
    color:var(--accent);
    font-family:'Segoe UI', system-ui, sans-serif;
    font-size:1.4rem;
    width:38px; height:38px;
    border-radius:50%;
    cursor:pointer;
    flex:none;
  }
  .navBtn:active{ transform:scale(0.92); }
  #counter{
    font-family:var(--font-body);
    font-size:0.85rem;
    letter-spacing:0.06em;
    opacity:0.9;
    min-width:160px;
    text-align:center;
  }
  .stage{
    position:relative;
    perspective:2400px;
    width:min(94vw, 66vh * 0.6667);
    aspect-ratio:2/3;
    max-height:78vh;
  }
  .card3d{
    --depth:6px;
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.05s linear;
    cursor:grab;
  }
  .card3d.snap{ transition:transform 0.4s ease; }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  .face.front{ transform:translateZ(calc(var(--depth) / 2)); }
  .face.back{ transform:rotateY(180deg) translateZ(calc(var(--depth) / 2)); }
  .edge{
    position:absolute;
    background:#4a5570;
    top:0; left:0;
  }
  .face img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    display:block;
  }
  #edges{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .back{ transform:rotateY(180deg); }
  #spinner{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(10,13,20,0.6);
    border-radius:14px;
    z-index:5;
  }
  #spinner.show{ display:flex; }
  #spinner::after{
    content:"";
    width:34px; height:34px;
    border:3px solid #2a3550;
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #hint{
    margin-top:16px;
    font-size:0.85rem;
    letter-spacing:0.04em;
    color:var(--muted);
    opacity:0.85;
    text-align:center;
    animation:fadeIn 0.8s ease-out 1s backwards;
  }
  #backBtn{
    position:fixed;
    top:14px;
    left:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    border:1px solid #24304a;
    color:var(--accent);
    font-family:'Segoe UI', system-ui, sans-serif;
    font-size:1.2rem;
    line-height:1;
    width:38px;
    height:38px;
    padding:0;
    border-radius:8px;
    cursor:pointer;
    z-index:20;
    transition:all .2s ease;
  }
  #backBtn:hover{ background:#1a2438; box-shadow:0 0 12px rgba(79,209,255,0.35); }
  #backBtn:active{ transform:scale(0.95); }
  /* Animaciones */
  @keyframes titleIn{
    from{ letter-spacing:0.28em; opacity:0; filter:blur(8px) drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(139,123,255,0)); }
  }
  @keyframes rainbow{
    to{ background-position:200% 0; }
  }
  @keyframes fadeIn{
    from{ opacity:0; }
  }
  @keyframes flicker{
    0%,19%,21%,23%,60%,62%,100%{ opacity:1; }
    20%,22%{ opacity:0.45; }
    61%{ opacity:0.7; }
  }
  @keyframes glitch{
    0%,90%,97%,100%{ transform:none; }
    91%{ transform:translate(-3px,0) skewX(-8deg); }
    93%{ transform:translate(3px,1px) skewX(6deg); }
    95%{ transform:translate(-1px,-1px); }
  }
  @keyframes drift{
    0%{ transform:translate3d(-4%,-3%,0) rotate(0deg) scale(1); }
    50%{ transform:translate3d(3%,4%,0) rotate(4deg) scale(1.08); }
    100%{ transform:translate3d(5%,-2%,0) rotate(-3deg) scale(1.02); }
  }
  @keyframes hexMove{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(0,48.4974px,0); }
  }
  @keyframes beam{
    from{ transform:translate3d(0,-140px,0); }
    85%,100%{ transform:translate3d(0,100vh,0); }
  }
  @media (prefers-reduced-motion: reduce){
    h1, #status, #hint, html::before, html::after, body::before{ animation:none; }
  }
</style>
</head>
<body>

  <button id="backBtn" onclick="regresar()" aria-label="Regresar" title="Regresar">&#8592;</button>

  <h1>CARTAS AEMX</h1>
  <div id="status">Cargando cartas desde GitHub...</div>

  <div id="viewer">
    <div class="stage">
      <div id="spinner"></div>
      <div class="card3d" id="card3d">
        <div class="face front"><img id="frontImg" src="" alt="carta" draggable="false"></div>
        <div class="face back"><img id="backImg" src="" alt="reverso" draggable="false"></div>
        <div id="edges"></div>
      </div>
    </div>
    <div class="navRow">
      <button class="navBtn" id="prevBtn">&#8249;</button>
      <div id="counter"></div>
      <button class="navBtn" id="nextBtn">&#8250;</button>
    </div>
    <div id="hint">Arrastra para rotar · toca para voltear</div>
  </div>

<script>
  // ---- CONFIGURACIÓN ----
  const GH_USER   = "Socram-13";
  const GH_REPO   = "GamerTag_AEMX";
  const GH_BRANCH = "main";
  const GH_FOLDER = "cartas";
  const BACK_FILENAME = "reverso.png"; // imagen fija de reverso

  // cartas.json lo genera y mantiene actualizado un GitHub Action cada vez que
  // cambia la carpeta cartas/ (ver .github/workflows/update-cartas-json.yml).
  // Se lee vía raw.githubusercontent.com para evitar la caché agresiva de
  // jsDelivr y el límite de 60 solicitudes/hora de api.github.com.
  const manifestUrl = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/${GH_BRANCH}/cartas.json`;
  const rawBase = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/${GH_BRANCH}/${GH_FOLDER}/`;

  const statusEl = document.getElementById('status');
  const counterEl = document.getElementById('counter');
  const viewer = document.getElementById('viewer');

  // ---- BOTÓN REGRESAR ----
  // Esta página se abre con window.open() desde el chat, así que primero
  // intentamos cerrar la pestaña. Si el navegador lo bloquea (por ejemplo
  // si la pestaña no fue abierta por script, o el usuario ya navegó dentro
  // de ella), navegamos de vuelta a index.html como respaldo.
  function regresar(){
    window.close();
    setTimeout(() => { window.location.href = 'index.html'; }, 150);
  }
  window.regresar = regresar;

  // ---- PROTECCIÓN BÁSICA CONTRA DESCARGA DIRECTA ----
  // No es infalible (siempre se puede hacer una captura de pantalla),
  // pero bloquea los métodos más comunes: clic derecho, arrastrar la
  // imagen al escritorio, seleccionarla, o el menú "Guardar imagen"
  // al mantener presionado en móvil.
  viewer.addEventListener('contextmenu', e => e.preventDefault());
  viewer.addEventListener('dragstart', e => e.preventDefault());
  viewer.addEventListener('selectstart', e => e.preventDefault());

  const IMG_EXT = /\.(png|jpe?g|webp)$/i;

  let cardFiles = [];
  let currentIndex = 0;

  fetch(manifestUrl, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
    .then(r => {
      if(!r.ok) throw new Error('No se pudo leer cartas.json (¿existe en la raíz del repo?)');
      return r.json();
    })
    .then(nombres => {
      cardFiles = nombres
        .filter(name => IMG_EXT.test(name) && name.toLowerCase() !== BACK_FILENAME.toLowerCase())
        .map(name => ({ name }));

      if(cardFiles.length === 0){
        statusEl.textContent = 'No se encontraron cartas en cartas.json.';
        viewer.style.display = 'none';
        return;
      }

      statusEl.textContent = `${cardFiles.length} carta(s) encontrada(s)`;
      showCard(0);
    })
    .catch(err => {
      statusEl.textContent = 'Error: ' + err.message;
      viewer.style.display = 'none';
    });

  // ---- VISOR 3D ----
  const card3d = document.getElementById('card3d');
  const frontImg = document.getElementById('frontImg');
  const backImg = document.getElementById('backImg');
  const spinnerEl = document.getElementById('spinner');
  const edgesEl = document.getElementById('edges');
  backImg.src = rawBase + encodeURIComponent(BACK_FILENAME);
  frontImg.addEventListener('load', () => spinnerEl.classList.remove('show'));
  frontImg.addEventListener('error', () => spinnerEl.classList.remove('show'));

  const DEPTH_PX = 6;   // debe coincidir con --depth en CSS
  const CORNER_R = 16;  // debe coincidir con el border-radius de .face
  const CORNER_SEGMENTS = 6;

  function arcPoints(cx, cy, r, t0, t1, segments){
    const pts = [];
    for(let i = 0; i <= segments; i++){
      const t = (t0 + (t1 - t0) * i / segments) * Math.PI / 180;
      pts.push({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) });
    }
    return pts;
  }

  function buildEdges(){
    const W = card3d.clientWidth;
    const H = card3d.clientHeight;
    if(W < 20 || H < 20) return;
    const ratio = W / H;
    if(ratio < 0.5 || ratio > 0.85) return; // la carta es ~2:3; si la medida no cuadra, es transitoria, ignorar
    const R = Math.min(CORNER_R, W / 2, H / 2);

    let pts = [{ x: R, y: 0 }, { x: W - R, y: 0 }];
    pts = pts.concat(arcPoints(W - R, R, R, -90, 0, CORNER_SEGMENTS).slice(1));
    pts.push({ x: W, y: H - R });
    pts = pts.concat(arcPoints(W - R, H - R, R, 0, 90, CORNER_SEGMENTS).slice(1));
    pts.push({ x: R, y: H });
    pts = pts.concat(arcPoints(R, H - R, R, 90, 180, CORNER_SEGMENTS).slice(1));
    pts.push({ x: 0, y: R });
    pts = pts.concat(arcPoints(R, R, R, 180, 270, CORNER_SEGMENTS).slice(1));

    // Blindaje: ningún punto puede caer fuera del área real de la carta
    pts = pts.map(p => ({
      x: Math.max(0, Math.min(W, p.x)),
      y: Math.max(0, Math.min(H, p.y))
    }));

    edgesEl.innerHTML = '';
    for(let i = 0; i < pts.length - 1; i++){
      const p1 = pts[i], p2 = pts[i + 1];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if(len < 0.01 || len > W + H) continue;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const seg = document.createElement('div');
      seg.className = 'edge';
      seg.style.left = p1.x + 'px';
      seg.style.top = p1.y + 'px';
      seg.style.width = (len + 0.5) + 'px'; // pequeño solape, evita costuras
      seg.style.height = DEPTH_PX + 'px';
      seg.style.transformOrigin = '0 0';
      seg.style.transform = `translateZ(${-DEPTH_PX / 2}px) rotateZ(${angle}deg) rotateX(90deg)`;
      edgesEl.appendChild(seg);
    }
  }

  window.addEventListener('resize', scheduleBuildEdges);

  let edgeRebuildTimer = null;
  function scheduleBuildEdges(){
    clearTimeout(edgeRebuildTimer);
    edgeRebuildTimer = setTimeout(buildEdges, 120);
  }
  const cardResizeObserver = new ResizeObserver(() => scheduleBuildEdges());
  cardResizeObserver.observe(card3d);

  let rotX = 0, rotY = 0;
  let dragging = false, moved = false;
  let lastX = 0, lastY = 0;

  function showCard(i){
    currentIndex = (i + cardFiles.length) % cardFiles.length;
    const url = rawBase + encodeURIComponent(cardFiles[currentIndex].name);

    spinnerEl.classList.add('show');
    frontImg.src = url;

    rotX = 0; rotY = 0;
    applyRotation(false);
    counterEl.textContent = `${currentIndex + 1} / ${cardFiles.length} — ${cardFiles[currentIndex].name.replace(IMG_EXT,'')}`;

    preloadNeighbors();
  }

  function preloadNeighbors(){
    [currentIndex - 1, currentIndex + 1].forEach(idx => {
      const f = cardFiles[(idx + cardFiles.length) % cardFiles.length];
      if(f){
        const img = new Image();
        img.src = rawBase + encodeURIComponent(f.name);
      }
    });
  }

  const NAV_MS = 320; // duración de cada mitad (salida / entrada)
  let navAnimating = false;

  function navigate(dir){
    if(navAnimating || cardFiles.length <= 1) return;
    navAnimating = true;
    dragging = false;
    card3d.style.pointerEvents = 'none';
    card3d.classList.remove('snap');

    // La navegación siempre parte de la carta en reposo (de frente)
    rotX = 0; rotY = 0;

    const nextIndex = (currentIndex + dir + cardFiles.length) % cardFiles.length;
    const nextUrl = rawBase + encodeURIComponent(cardFiles[nextIndex].name);

    // dir > 0 (siguiente): la carta sale por la izquierda y la nueva entra por la derecha
    const EXIT_X  = dir > 0 ? -130 : 130;
    const EXIT_ROT = dir > 0 ? -30 : 30;
    const ENTER_X  = -EXIT_X;
    const ENTER_ROT = -EXIT_ROT;

    // Fase 1: la carta real se desliza y gira levemente en Y hacia afuera,
    // dejando ver su borde/profundidad real mientras se va de perfil.
    card3d.style.transition = `transform ${NAV_MS}ms cubic-bezier(.45,0,.2,1)`;
    requestAnimationFrame(() => {
      card3d.style.transform = `translateX(${EXIT_X}%) rotateY(${EXIT_ROT}deg)`;
    });

    setTimeout(() => {
      // Está fuera de vista (de perfil): cambiamos la imagen y la reubicamos
      // del otro lado, también de perfil, sin transición (instantáneo).
      frontImg.src = nextUrl;
      card3d.style.transition = 'none';
      card3d.style.transform = `translateX(${ENTER_X}%) rotateY(${ENTER_ROT}deg)`;
      void card3d.offsetWidth; // forzar reflow

      // Fase 2: entra deslizándose y se endereza hasta quedar plana.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card3d.style.transition = `transform ${NAV_MS}ms cubic-bezier(.2,0,.3,1)`;
          card3d.style.transform = 'translateX(0%) rotateY(0deg)';
        });
      });

      setTimeout(() => {
        currentIndex = nextIndex;
        counterEl.textContent = `${currentIndex + 1} / ${cardFiles.length} — ${cardFiles[currentIndex].name.replace(IMG_EXT,'')}`;
        preloadNeighbors();

        card3d.style.transition = '';
        card3d.style.transform = '';
        card3d.style.pointerEvents = '';
        navAnimating = false;
      }, NAV_MS);
    }, NAV_MS);
  }

  document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
  document.getElementById('nextBtn').addEventListener('click', () => navigate(1));

  function applyRotation(snap){
    card3d.classList.toggle('snap', snap);
    card3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function pointerDown(x,y){
    dragging = true; moved = false;
    lastX = x; lastY = y;
    card3d.classList.remove('snap');
  }

  function pointerMove(x,y){
    if(!dragging) return;
    const dx = x - lastX, dy = y - lastY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    rotY += dx * 0.4;
    rotX -= dy * 0.4;
    rotX = Math.max(-60, Math.min(60, rotX));
    lastX = x; lastY = y;
    applyRotation(false);
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;

    if(!moved){
      // toque simple = voltear (se suma 180° al ángulo actual)
      rotY += 180;
    }
    // se queda en el ángulo actual, no se resetea
    applyRotation(true);
  }

  card3d.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  card3d.addEventListener('touchstart', e => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, {passive:true});
  card3d.addEventListener('touchmove', e => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, {passive:true});
  card3d.addEventListener('touchend', pointerUp);
</script>
