<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Cartas AEMX</title>
<style>
  :root{
    --bg:#0a0d14;
    --panel:#131a26;
    --accent:#4fd1ff;
    --text:#e8f1ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:radial-gradient(circle at 50% 0%, #182233 0%, var(--bg) 70%);
    color:var(--text);
    min-height:100vh;
    padding:20px;
  }
  h1{
    text-align:center;
    font-size:1.4rem;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:4px;
  }
  #status{
    text-align:center;
    font-size:0.85rem;
    opacity:0.7;
    margin-bottom:10px;
  }
  #viewer{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action:none;
    min-height:80vh;
  }
  .navRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
  }
  .navBtn{
    background:var(--panel);
    border:1px solid #24304a;
    color:var(--accent);
    font-size:1.4rem;
    width:38px; height:38px;
    border-radius:50%;
    cursor:pointer;
    flex:none;
  }
  .navBtn:active{ transform:scale(0.92); }
  #counter{
    font-size:0.8rem;
    opacity:0.8;
    min-width:160px;
    text-align:center;
  }
  .stage{
    perspective:2400px;
    width:min(94vw, 66vh * 0.6667);
    aspect-ratio:2/3;
    max-height:78vh;
  }
  .card3d{
    --depth:6px;
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.05s linear;
    cursor:grab;
  }
  .card3d.snap{ transition:transform 0.4s ease; }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  .face.front{ transform:translateZ(calc(var(--depth) / 2)); }
  .face.back{ transform:rotateY(180deg) translateZ(calc(var(--depth) / 2)); }
  .edge{
    position:absolute;
    background:#4a5570;
    top:0; left:0;
  }
  .face img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    display:block;
  }
  #edges{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .back{ transform:rotateY(180deg); }
  #spinner{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(10,13,20,0.6);
    border-radius:14px;
    z-index:5;
  }
  #spinner.show{ display:flex; }
  #spinner::after{
    content:"";
    width:34px; height:34px;
    border:3px solid #2a3550;
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #hint{
    margin-top:16px;
    font-size:0.8rem;
    opacity:0.6;
    text-align:center;
  }
</style>
</head>
<body>

  <h1>CARTAS AEMX</h1>
  <div id="status">Cargando cartas desde GitHub...</div>

  <div id="viewer">
    <div class="stage">
      <div id="spinner"></div>
      <div class="card3d" id="card3d">
        <div class="face front"><img id="frontImg" src="" alt="carta"></div>
        <div class="face back"><img id="backImg" src="" alt="reverso"></div>
        <div id="edges"></div>
      </div>
    </div>
    <div class="navRow">
      <button class="navBtn" id="prevBtn">&#8249;</button>
      <div id="counter"></div>
      <button class="navBtn" id="nextBtn">&#8250;</button>
    </div>
    <div id="hint">Arrastra para rotar · toca para voltear</div>
  </div>

<script>
  // ---- CONFIGURACIÓN ----
  const GH_USER   = "Socram-13";
  const GH_REPO   = "GamerTag_AEMX";
  const GH_BRANCH = "main";
  const GH_FOLDER = "cartas";
  const BACK_FILENAME = "reverso.png"; // imagen fija de reverso

  const apiUrl = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FOLDER}?ref=${GH_BRANCH}`;
  const rawBase = `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@${GH_BRANCH}/${GH_FOLDER}/`;

  const statusEl = document.getElementById('status');
  const counterEl = document.getElementById('counter');
  const viewer = document.getElementById('viewer');

  const IMG_EXT = /\.(png|jpe?g|webp)$/i;

  let cardFiles = [];
  let currentIndex = 0;

  fetch(apiUrl)
    .then(r => {
      if(!r.ok) throw new Error('No se pudo leer la carpeta (¿existe "cartas/" y es pública?)');
      return r.json();
    })
    .then(files => {
      cardFiles = files.filter(f =>
        f.type === 'file' &&
        IMG_EXT.test(f.name) &&
        f.name.toLowerCase() !== BACK_FILENAME.toLowerCase()
      );

      if(cardFiles.length === 0){
        statusEl.textContent = 'No se encontraron cartas en la carpeta "cartas/".';
        viewer.style.display = 'none';
        return;
      }

      statusEl.textContent = `${cardFiles.length} carta(s) encontrada(s)`;
      showCard(0);
    })
    .catch(err => {
      statusEl.textContent = 'Error: ' + err.message;
      viewer.style.display = 'none';
    });

  // ---- VISOR 3D ----
  const card3d = document.getElementById('card3d');
  const frontImg = document.getElementById('frontImg');
  const backImg = document.getElementById('backImg');
  const spinnerEl = document.getElementById('spinner');
  const edgesEl = document.getElementById('edges');
  backImg.src = rawBase + encodeURIComponent(BACK_FILENAME);
  frontImg.addEventListener('load', () => spinnerEl.classList.remove('show'));
  frontImg.addEventListener('error', () => spinnerEl.classList.remove('show'));

  const DEPTH_PX = 6;   // debe coincidir con --depth en CSS
  const CORNER_R = 16;  // debe coincidir con el border-radius de .face
  const CORNER_SEGMENTS = 6;

  function arcPoints(cx, cy, r, t0, t1, segments){
    const pts = [];
    for(let i = 0; i <= segments; i++){
      const t = (t0 + (t1 - t0) * i / segments) * Math.PI / 180;
      pts.push({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) });
    }
    return pts;
  }

  function buildEdges(){
    const W = card3d.clientWidth;
    const H = card3d.clientHeight;
    if(W < 20 || H < 20) return;
    const ratio = W / H;
    if(ratio < 0.5 || ratio > 0.85) return; // la carta es ~2:3; si la medida no cuadra, es transitoria, ignorar
    const R = Math.min(CORNER_R, W / 2, H / 2);

    let pts = [{ x: R, y: 0 }, { x: W - R, y: 0 }];
    pts = pts.concat(arcPoints(W - R, R, R, -90, 0, CORNER_SEGMENTS).slice(1));
    pts.push({ x: W, y: H - R });
    pts = pts.concat(arcPoints(W - R, H - R, R, 0, 90, CORNER_SEGMENTS).slice(1));
    pts.push({ x: R, y: H });
    pts = pts.concat(arcPoints(R, H - R, R, 90, 180, CORNER_SEGMENTS).slice(1));
    pts.push({ x: 0, y: R });
    pts = pts.concat(arcPoints(R, R, R, 180, 270, CORNER_SEGMENTS).slice(1));

    // Blindaje: ningún punto puede caer fuera del área real de la carta
    pts = pts.map(p => ({
      x: Math.max(0, Math.min(W, p.x)),
      y: Math.max(0, Math.min(H, p.y))
    }));

    edgesEl.innerHTML = '';
    for(let i = 0; i < pts.length - 1; i++){
      const p1 = pts[i], p2 = pts[i + 1];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if(len < 0.01 || len > W + H) continue;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const seg = document.createElement('div');
      seg.className = 'edge';
      seg.style.left = p1.x + 'px';
      seg.style.top = p1.y + 'px';
      seg.style.width = (len + 0.5) + 'px'; // pequeño solape, evita costuras
      seg.style.height = DEPTH_PX + 'px';
      seg.style.transformOrigin = '0 0';
      seg.style.transform = `translateZ(${-DEPTH_PX / 2}px) rotateZ(${angle}deg) rotateX(90deg)`;
      edgesEl.appendChild(seg);
    }
  }

  window.addEventListener('resize', scheduleBuildEdges);

  let edgeRebuildTimer = null;
  function scheduleBuildEdges(){
    clearTimeout(edgeRebuildTimer);
    edgeRebuildTimer = setTimeout(buildEdges, 120);
  }
  const cardResizeObserver = new ResizeObserver(() => scheduleBuildEdges());
  cardResizeObserver.observe(card3d);

  let rotX = 0, rotY = 0;
  let dragging = false, moved = false;
  let lastX = 0, lastY = 0;

  function showCard(i){
    currentIndex = (i + cardFiles.length) % cardFiles.length;
    const url = rawBase + encodeURIComponent(cardFiles[currentIndex].name);

    spinnerEl.classList.add('show');
    frontImg.src = url;

    rotX = 0; rotY = 0;
    applyRotation(false);
    counterEl.textContent = `${currentIndex + 1} / ${cardFiles.length} — ${cardFiles[currentIndex].name.replace(IMG_EXT,'')}`;

    preloadNeighbors();
  }

  function preloadNeighbors(){
    [currentIndex - 1, currentIndex + 1].forEach(idx => {
      const f = cardFiles[(idx + cardFiles.length) % cardFiles.length];
      if(f){
        const img = new Image();
        img.src = rawBase + encodeURIComponent(f.name);
      }
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => showCard(currentIndex - 1));
  document.getElementById('nextBtn').addEventListener('click', () => showCard(currentIndex + 1));

  function applyRotation(snap){
    card3d.classList.toggle('snap', snap);
    card3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function pointerDown(x,y){
    dragging = true; moved = false;
    lastX = x; lastY = y;
    card3d.classList.remove('snap');
  }

  function pointerMove(x,y){
    if(!dragging) return;
    const dx = x - lastX, dy = y - lastY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    rotY += dx * 0.4;
    rotX -= dy * 0.4;
    rotX = Math.max(-60, Math.min(60, rotX));
    lastX = x; lastY = y;
    applyRotation(false);
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;

    if(!moved){
      // toque simple = voltear (se suma 180° al ángulo actual)
      rotY += 180;
    }
    // se queda en el ángulo actual, no se resetea
    applyRotation(true);
  }

  card3d.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  card3d.addEventListener('touchstart', e => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, {passive:true});
  card3d.addEventListener('touchmove', e => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, {passive:true});
  card3d.addEventListener('touchend', pointerUp);
</script>
</body>
</html>
