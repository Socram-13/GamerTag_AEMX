  :root {

    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;

  .brand { pointer-events: auto; min-width: 0; }
  .me { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(380px, 100%); padding: 6px 16px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); color: var(--ink); font-family: var(--f-body); text-align: left; cursor: pointer; }

  .me:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .me[hidden] { display: none; }

  .me-txt { display: flex; flex-direction: column; min-width: 0; }
  .me-name { font: 700 17px/1.15 var(--f-display); letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-sub { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-sub b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan); font-weight: 700; }
  h1 { margin: 2px 0 0; font-family: var(--f-display); font-size: 19px; font-weight: 700; letter-spacing: 0.05em; }
  .tag { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .search { position: relative; flex: 1 1 260px; max-width: 380px; pointer-events: auto; }
  .search input {
    width: 100%; height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: 600 15px var(--f-body);
  }
  .search input::placeholder { color: var(--muted); font-weight: 500; }
  .search input:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #res { list-style: none; margin: 6px 0 0; padding: 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); position: absolute; left: 0; right: 0; z-index: 5; }
  #res button { width: 100%; display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font: 600 14px var(--f-body); cursor: pointer; text-align: left; }
  #res button:hover { background: rgba(63, 208, 255, 0.12); }
  #res small { color: var(--muted); font-weight: 500; }
  .tools { display: flex; gap: 8px; pointer-events: auto; margin-left: auto; }

  .stage.ui-off .me, .stage.ui-off .search, .stage.ui-off #card, .stage.ui-off .tools button:not(#b-ui) { display: none !important; }
  .tools button {
    height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 600 14px var(--f-body); cursor: pointer;
  }
  .tools button:hover { border-color: var(--cyan); }
  .tools button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .legend { pointer-events: auto; display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); max-width: 100%; }
  .legend .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .legend b { color: var(--ink); font-weight: 600; margin-right: 2px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chip { padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; }
  .card { pointer-events: auto; position: relative; width: min(340px, 100%); padding: 14px 16px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); }
  .card .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }

  .rank { display: inline-block; margin-bottom: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); }

  #gate p { margin: 0 0 16px; color: var(--muted); }
  #gate button { height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--cyan); background: transparent; color: var(--ink); font: 700 15px var(--f-body); cursor: pointer; }

<main class="stage" id="stage">
  <canvas id="gl" aria-label="Mapa de México en 3D con una ciudad espacial. Arrastra para girar, pellizca o usa la rueda para acercar."></canvas>
  <div id="labels"></div>
  <div class="hud">
    <header class="top">
      <button type="button" class="me" id="me" aria-label="Mi perfil" hidden>
        <span class="me-av" id="me-av"><span id="me-ini"></span></span>
        <span class="me-txt">
          <span class="me-name" id="me-name"></span>
          <span class="me-sub"><b id="me-total"></b> parcelas · <span id="me-state"></span></span>
        </span>
      </button>
      <div class="search">
        <input id="q" type="search" placeholder="Busca un gamertag o ciudad" autocomplete="off" aria-label="Buscar jugador o ciudad">
        <ul id="res" hidden></ul>
      </div>
      <div class="tools">
        <button type="button" id="b-over">México</button>
        <button type="button" id="b-pal">Palacio</button>
        <button type="button" id="b-lbl" aria-pressed="false" title="Mostrar u ocultar etiquetas">Etiquetas</button>
        <button type="button" id="b-snd" aria-pressed="true" aria-label="Activar o desactivar el sonido" title="Activar o desactivar el sonido">🔊</button>
        <button type="button" id="b-ui" aria-pressed="false" title="Mostrar u ocultar la interfaz">Ocultar</button>
      </div>
      <!-- Controles anteriores: ocultos (se conservan por si se quieren recuperar) -->
      <div class="old-top" hidden>
        <div class="brand">
          <p class="eyebrow">Atlas Earth AEMX</p>
          <h1>Mapa espacial</h1>
          <p class="tag">Cargando datos…</p>
        </div>
      </div>
    </header>
    <footer class="bottom">
      <aside class="card" id="card" hidden>
        <button type="button" class="x" id="cx" aria-label="Cerrar">×</button>
        <span class="rank" id="c-rank"></span>
        <h2 id="c-name"></h2>
        <p class="meta" id="c-meta"></p>
        <div class="total"><span id="c-total"></span><small>parcelas</small></div>
        <div class="bar" id="c-bar"></div>
        <ul class="rows" id="c-rows"></ul>
        <p class="lvl" id="c-lvl"></p>
      </aside>
    </footer>
  </div>
  <div id="fail" hidden><p>No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la página.</p></div>
</main>

<div id="gate">
  <div class="box">
    <h2>Mapa espacial AEMX</h2>
    <p id="gate-msg">Inicia sesión con Google para ver a los jugadores en el mapa.</p>
    <button type="button" id="gate-btn">Iniciar con Google</button>
    <p id="gate-err" hidden></p>
  </div>
</div>

        bk = car.dd / dmv; ex = car.x - ddx * bk; ez = car.z - ddz * bk; /* posición intermedia dentro del recorrido de este cuadro */
        for (side = -1; side <= 1; side += 2) {
          p = carPuffs[car.pi]; car.pi = (car.pi + 1) % carPuffs.length;
          px = ex - sY * 0.85 + cY * side * 0.62 + (Math.random() - 0.5) * 0.1;
          pz = ez - cY * 0.85 - sY * side * 0.62 + (Math.random() - 0.5) * 0.1;
          p.life = 0; p.m.visible = true;
          p.by = terrainH(px, pz);
          p.m.position.set(px, p.by + 0.12, pz);
        }
      }
      if (car.dd > DUST_STEP) car.dd = 0;
    } else car.dd = 0;
    for (i = 0; i < carPuffs.length; i++) {
      p = carPuffs[i];
      if (p.life >= DUST_LIFE) { if (p.m.visible) p.m.visible = false; continue; }
      p.life += dt; k = Math.min(1, p.life / DUST_LIFE);
      p.m.scale.setScalar(0.15 + 0.3 * k); p.m.position.y = (p.by || 0) + 0.12 + 0.15 * k; p.m.material.opacity = 0.45 * (1 - k);
    }
  }

  /* ---------- Caminante: túnica café, bastón largo y casco de Pac-Man; recorre los senderos entre ciudades y salta a un lado si pasa el coche ---------- */
  var wand = null, wandFollow = false, wandOff = new THREE.Vector3();
  var wCloth = new THREE.MeshLambertMaterial({ color: 0x7a4e2a, side: THREE.DoubleSide });
  var wClothD = new THREE.MeshLambertMaterial({ color: 0x5a3a20, side: THREE.DoubleSide });
  var wWood = new THREE.MeshLambertMaterial({ color: 0x8a5a2b });
  var wPac = new THREE.MeshLambertMaterial({ color: 0xffd100, emissive: 0x332a00, side: THREE.DoubleSide });
  var wInner = new THREE.MeshLambertMaterial({ color: 0x15171c });
  var wEye = new THREE.MeshBasicMaterial({ color: 0x000000 });
  function makeWanderer() {
    var a = makeAstronaut(), g = a.g, m, mouth = 1.0, cape, hand;
    g.children[2].visible = false; g.children[3].visible = false; /* se quita el casco normal y su visor */
    /* Casco de Pac-Man con la boca hacia el frente (+z) */
    var pg = new THREE.SphereGeometry(0.34, 20, 14, Math.PI / 2 + mouth / 2, Math.PI * 2 - mouth); pg.rotateZ(Math.PI / 2); /* la boca se abre en vertical (mandíbula arriba y abajo), al frente */
    m = new THREE.Mesh(pg, wPac); m.position.y = 1.5; g.add(m);
    m = new THREE.Mesh(uSphere, wInner); m.scale.setScalar(0.3); m.position.y = 1.5; g.add(m);
    [-1, 1].forEach(function (sd) { var e = new THREE.Mesh(uSphere, wEye); e.scale.setScalar(0.05); e.position.set(sd * 0.2, 1.68, 0.12); g.add(e); });
    /* Túnica larga y capa en la espalda */
    m = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.56, 1.0, 12, 1, true), wCloth); m.position.y = 0.78; g.add(m);
    m = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.36, 0.22, 12, 1, true), wClothD); m.position.y = 1.17; g.add(m);
    cape = new THREE.Group(); cape.position.set(0, 1.25, -0.3); g.add(cape);
    m = new THREE.Mesh(uBox, wClothD); m.scale.set(0.62, 0.95, 0.05); m.position.y = -0.47; cape.add(m);
    a.parts.armL.children[0].material = wCloth; a.parts.armR.children[0].material = wCloth;
    /* Mangas anchas y brazos separados del cuerpo para que se vean fuera de la túnica */
    a.parts.armL.children[0].scale.set(1.7, 1, 1.7); a.parts.armR.children[0].scale.set(1.7, 1, 1.7);
    a.parts.armL.position.x = -0.44; a.parts.armR.position.x = 0.44;
    a.parts.armL.rotation.z = -0.22; a.parts.armR.rotation.z = 0.22;
    /* Bastón largo en la mano derecha (se contrarrota para que siempre quede vertical) */
    hand = new THREE.Group(); hand.position.set(0, -0.45, 0.05); a.parts.armR.add(hand);
    m = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 2.1, 6), wWood); m.position.y = 0.3; hand.add(m);
    m = new THREE.Mesh(uSphere, wWood); m.scale.setScalar(0.07); m.position.y = 1.38; hand.add(m);
    g.visible = false; noRay(g); scene.add(g);
    return { a: a, cape: cape, hand: hand, path: null, next: null, s: 0, x: 0, z: 0, yaw: null, last: -1, off: 0, side: 1, dodge: false, hop: 0 };
  }
  function updateWanderer(t, dt) {
    var W = wand, path, seg, f, x, z, tx, tz, l, nx, nz, i, c, cand, ti, nxt, lp, dc, bx, bz, hopY = 0, u, sw, gy, a, vis;
    if (!trails.length) return;
    if (!W) {
      W = wand = makeWanderer();
      i = (Math.random() * trails.length) | 0;
      W.path = edgePath(i, trails[i].a); W.last = i; W.s = Math.random() * W.path.len * 0.5;
    }
    a = W.a; W.s += 1.2 * dt; path = W.path;
    while (path && W.s >= path.len) {
      W.s -= path.len;
      if (path.kind === 'arc') { W.path = W.next; W.next = null; path = W.path; W.s = 0; }
      else {
        c = path.end; cand = [];
        for (ti = 0; ti < trails.length; ti++) if (trails[ti].a === c || trails[ti].b === c) cand.push(ti);
        if (cand.length > 1) cand = cand.filter(function (q) { return q !== W.last; });
        ti = cand[(Math.random() * cand.length) | 0]; W.last = ti;
        nxt = edgePath(ti, c); lp = path.pts[path.pts.length - 1];
        W.next = nxt; W.path = arcPath(c, lp, nxt.pts[0]); path = W.path; W.s = 0;
      }
    }
    if (!path) return;
    while (path.idx < path.pts.length - 2 && path.cum[path.idx + 1] <= W.s) path.idx++;
    seg = path.cum[path.idx + 1] - path.cum[path.idx];
    f = seg > 0 ? Math.min(1, Math.max(0, (W.s - path.cum[path.idx]) / seg)) : 0;
    x = path.pts[path.idx][0]; z = path.pts[path.idx][1];
    tx = path.pts[path.idx + 1][0] - x; tz = path.pts[path.idx + 1][1] - z;
    bx = x + tx * f; bz = z + tz * f;
    l = Math.hypot(tx, tz);
    if (l > 1e-6) {
      u = Math.atan2(tx, tz);
      if (W.yaw === null) W.yaw = u; else W.yaw += nAng(u - W.yaw) * Math.min(1, dt * 6);
      nx = tz / l; nz = -tx / l;
    } else { if (W.yaw === null) W.yaw = 0; nx = 0; nz = 0; }
    /* Esquiva: si el coche se acerca, salta a un lado del sendero y vuelve cuando se aleja */
    if (car) {
      dc = Math.hypot(car.x - bx, car.z - bz);
      if (!W.dodge && dc < 14 && (car.v > 2 || dc < 6)) { W.dodge = true; W.side = Math.random() < 0.5 ? 1 : -1; W.hop = 0.55; }
      else if (W.dodge && dc > 17) W.dodge = false;
    } else W.dodge = false;
    W.off += ((W.dodge ? W.side * 2.6 : 0) - W.off) * Math.min(1, dt * 8);
    x = bx + nx * W.off; z = bz + nz * W.off;
    if (W.hop > 0) { W.hop -= dt; u = Math.min(1, Math.max(0, 1 - W.hop / 0.55)); hopY = Math.sin(Math.PI * u) * 0.55; }
    W.x = x; W.z = z;
    vis = Math.hypot(camera.position.x - x, camera.position.z - z) < 500;
    if (a.g.visible !== vis) a.g.visible = vis;
    if (!vis) return;
    gy = Math.max(0, terrainH(x, z)) + 0.06;
    a.g.rotation.y = W.yaw;
    a.g.position.set(x, gy + hopY + Math.abs(Math.sin(t * 3)) * 0.03, z);
    sw = Math.sin(t * 3) * 0.5;
    if (hopY > 0.02) { /* en el aire: brazo libre arriba y piernas recogidas */
      a.parts.legL.rotation.x = -0.8; a.parts.legR.rotation.x = -0.5; a.parts.armL.rotation.x = -2.4; a.parts.armR.rotation.x = -0.6;
    } else {
      a.parts.legL.rotation.x = sw; a.parts.legR.rotation.x = -sw; a.parts.armL.rotation.x = -sw * 1.2; a.parts.armR.rotation.x = -0.3 + sw * 0.5;
    }
    /* El bastón se balancea con el paso: se adelanta y se atrasa mientras camina */
    W.hand.rotation.x = -a.parts.armR.rotation.x + (hopY > 0.02 ? 0 : 0.6 * sw); W.hand.rotation.z = -a.parts.armR.rotation.z;
    W.cape.rotation.x = 0.12 + 0.1 * Math.sin(t * 5 + 1);
  }

  /* Presidente: camina saludando por el balcón; si el OVNI pasa por el frente, saca la pistola y le dispara */
  function updatePresident(t, dt) {
    var i, w, a, U, dx, dy, dz, d3, ok, k, vN, amp, sws, ty, df, vx, vy, vz, vl, rx, rz;
    for (i = 0; i < presAst.length; i++) {
      w = presAst[i]; a = w.a;
      a.getWorldPosition(prP);
      U = ufo && !ufoDown() && !ufoOverVolc() && ufoInPresCity() && ufo.g.visible && clock.elapsedTime >= (ufo.noFireUntil || 0) ? ufo.g.position : null;
      ok = false;
      if (U) {
        dx = U.x - prP.x; dz = U.z - prP.z; dy = U.y - (prP.y + 0.9);
        d3 = Math.sqrt(dx * dx + dy * dy + dz * dz);
        ok = dz > (w.eng ? -2 : 2) && d3 < (w.eng ? 68 : 55); /* al frente del Palacio y a tiro */
      }
      /* Velocidad estimada del OVNI (suavizada) para calcular el adelanto */
      if (U && w.pu && dt > 0) {
        w.vx += ((U.x - w.pux) / dt - w.vx) * Math.min(1, dt * 6);
        w.vy += ((U.y - w.puy) / dt - w.vy) * Math.min(1, dt * 6);
        w.vz += ((U.z - w.puz) / dt - w.vz) * Math.min(1, dt * 6);
      } else { w.vx = 0; w.vy = 0; w.vz = 0; }
      if (U) { w.pu = true; w.pux = U.x; w.puy = U.y; w.puz = U.z; } else w.pu = false;
      w.eng = ok;
      w.wk += ((ok ? 0 : 1) - w.wk) * Math.min(1, dt * 4);
      w.k += ((ok ? 1 : 0) - w.k) * Math.min(1, dt * 6);
      k = w.k;
      /* Camina de lado a lado (se detiene al apuntar) */
      w.pa += dt * 0.45 * w.wk;
      vN = Math.cos(w.pa); amp = Math.min(1, Math.abs(vN) * 1.6) * w.wk; sws = Math.sin(t * 7) * 0.55 * amp;
      a.position.x = Math.sin(w.pa) * 1.1;
      a.position.y = w.y0 + Math.abs(Math.sin(t * 7)) * 0.03 * amp;
      w.legL.rotation.x = sws; w.legR.rotation.x = -sws;
      ty = ok ? Math.atan2(dx, dz) - Math.PI : Math.PI - 0.9 * vN * w.wk;
      df = nAng(ty - w.yaw);
      w.yaw += df * Math.min(1, dt * (ok ? 8 : 5));
      a.rotation.y = w.yaw;
      a.updateMatrixWorld(true);
      /* Brazo: saludo, o apuntando al OVNI */
      if (ok) {
        prT.copy(U); a.worldToLocal(prT);
        vx = prT.x - 0.33; vy = prT.y - 1.2; vz = prT.z;
        vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1; vx /= vl; vy /= vl; vz /= vl;
        w.az = Math.asin(Math.max(-1, Math.min(1, vx))); w.ax = Math.atan2(-vz, -vy);
      }
      rx = -2.6 + 0.12 * Math.sin(t * 3 + w.ph); rz = Math.sin(t * 9 + w.ph) * 0.45;
      w.armR.rotation.x = rx + (w.ax - rx) * k;
      w.armR.rotation.z = rz + (w.az - rz) * k;
      w.gun.visible = k > 0.2;
      /* Disparo: ya apuntando, en ráfagas */
      w.fireT -= dt;
      if (ok && k > 0.85 && w.fireT <= 0) {
        w.fireT = 0.25 + Math.random() * 0.1;
        a.updateMatrixWorld(true);
        w.muz.getWorldPosition(prM);
        /* Apunta con adelanto: calcula dónde estará el OVNI cuando llegue la bala y casi sin dispersión */
        prL.copy(U);
        for (var it = 0; it < 3; it++) {
          prL.set(U.x + w.vx * (prL.distanceTo(prM) / BUL_SPEED), U.y + w.vy * (prL.distanceTo(prM) / BUL_SPEED), U.z + w.vz * (prL.distanceTo(prM) / BUL_SPEED));
        }
        fireBullet(prM, prL, 0.012);
      }
    }
  }

  function blockedRects() {
    var out = [], sr = stage.getBoundingClientRect();
    ['.top', '#legend', '#card'].forEach(function (sel) {
      var e = document.querySelector(sel);
      if (!e || e.hidden) return;
      var b = e.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      out.push([b.left - sr.left - 6, b.top - sr.top - 6, b.right - sr.left + 6, b.bottom - sr.top + 6]);
    });
    return out;
  }

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k, n;

    if (fly) {
      fly.t = Math.min(1, fly.t + dt / fly.dur);
      k = fly.t * fly.t * (3 - 2 * fly.t);
      controls.target.lerpVectors(fly.fa, fly.fb, k);
      camera.position.lerpVectors(fly.pa, fly.pb, k);
      if (fly.t >= 1) fly = null;
    }
    if (ufoFollow && ufo) {
      var upos = ufo.g.position;
      if (fly) { fly.fb.copy(upos); fly.pb.copy(upos).add(ufoOff); ufoPrev = null; }
      else {
        /* Sigue el desplazamiento del OVNI al instante (sin retraso aunque vaya muy rápido); un salto brusco (reaparición) se suaviza abajo */
        if (!ufoPrev) ufoPrev = new THREE.Vector3(ufo.x, ufo.y, ufo.z);
        var mvx = ufo.x - ufoPrev.x, mvy = ufo.y - ufoPrev.y, mvz = ufo.z - ufoPrev.z;
        ufoPrev.set(ufo.x, ufo.y, ufo.z);
        if (dt > 0 && Math.sqrt(mvx * mvx + mvy * mvy + mvz * mvz) / dt < 300) {
          controls.target.x += mvx; controls.target.y += mvy; controls.target.z += mvz;
          camera.position.x += mvx; camera.position.y += mvy; camera.position.z += mvz;
        }
        var fk = Math.min(1, dt * 4), fdx = (upos.x - controls.target.x) * fk, fdy = (upos.y - controls.target.y) * fk, fdz = (upos.z - controls.target.z) * fk;
        controls.target.x += fdx; controls.target.y += fdy; controls.target.z += fdz;
        camera.position.x += fdx; camera.position.y += fdy; camera.position.z += fdz;
      }
    }
    if (carFollow && car) {
      var cpos = car.g.position;
      if (fly) { fly.fb.set(cpos.x, cpos.y + 1, cpos.z); fly.pb.set(cpos.x, cpos.y + 1, cpos.z).add(carOff); }
      else {
        var ck = Math.min(1, dt * 4), cdx = (cpos.x - controls.target.x) * ck, cdy = (cpos.y + 1 - controls.target.y) * ck, cdz = (cpos.z - controls.target.z) * ck;

      }
    }
    controls.autoRotate = rotOn && !fly && !selected && !ufoFollow && !carFollow && !wandFollow && !turretCam;
    controls.update();
    controls.target.x = clamp(controls.target.x, -1750, 1750);
    controls.target.z = clamp(controls.target.z, -1300, 1300);
    controls.target.y = clamp(controls.target.y, 0, 60);

    sky.position.copy(camera.position);
    starsA.position.copy(camera.position); starsB.position.copy(camera.position);
    starsA.material.opacity = 0.65 + 0.3 * Math.sin(t * 1.3);
    starsB.material.opacity = 0.65 + 0.3 * Math.sin(t * 1.7 + 2.0);
    sun.target.position.copy(controls.target);
    sun.position.copy(controls.target).add(SUN_OFF);

    for (n = 0; n < spinners.length; n++) spinners[n].obj.rotation.y += spinners[n].speed * dt;
    updateWalkers(dt, t);
    for (n = 0; n < blinkers.length; n++) blinkers[n].mesh.scale.setScalar(0.85 + 0.35 * Math.sin(t * 3 + blinkers[n].phase));
    updateCyber(t);
    updateDrones(t, dt);
    updateUfo(t, dt);
    ufoSpotStep(t, dt);
    updateCar(t, dt);
    updateWanderer(t, dt);
    updatePresident(t, dt);
    updateBullets(dt);
    updateFx(dt);
    craterStep(dt);
    volcanoStep(dt);
    updateSea(t);
    AUD.update(t);
    /* Vista desde la torreta: cámara sobre ella, mirando hacia donde apuntan los cañones */
    if (turretCam && car) {
      car.g.updateMatrixWorld(true);
      tcP.set(0, 0.85, -0.35); car.bar.localToWorld(tcP); camera.position.copy(tcP);
      tcT.set(0, 0.15, 10); car.bar.localToWorld(tcT); camera.lookAt(tcT);
    }
    updateRuins(t);
    updateCamps(t, dt);
    updateSunbathers(t, dt);
    if (selected) selRing.rotation.z = t * 0.8;

    var labelsOn = labelsEl.style.display !== 'none';
    var rects = blockedRects();
    for (n = 0; n < players.length; n++) {
      var p = players[n];
      var d = camera.position.distanceTo(p.wpos);
      placeLabel(p.pill, p.wpos, (p.isPres && d < 220) || p === selected || d < LABEL_D, p === selected ? null : rects, true);
    }
    if (!districts._order) districts._order = districts.slice().sort(function (a, b) { return b.list.length - a.list.length; });
    for (n = 0; n < districts.length; n++) {
      var dd = districts[n];
      var d0 = camera.position.distanceTo(dd.pinPos);
      var s = Math.max(1, d0 / 90) / 3;
      dd.pin.scale.setScalar(s);
      dd.pin.visible = labelsOn && d0 > PIN_D;
      dd.wpos.y = 0.35 + 6.6 * (d0 > PIN_D ? s : 1);
    }
    for (n = 0; n < districts._order.length; n++) {
      var d1 = districts._order[n];
      placeLabel(d1.el, d1.wpos, camera.position.distanceTo(d1.pinPos) > DIST_NEAR, rects);
    }
    var dp = camera.position.distanceTo(presPinPos);
    presPin.scale.setScalar(Math.max(1, dp / 90) * 1.3 / 3);
    presPin.visible = labelsOn && dp > PIN_D;

    renderer.render(scene, camera);
  }
  frame();
};
