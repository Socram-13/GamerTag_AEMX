<style>

    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .brand { pointer-events: auto; min-width: 0; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan); font-weight: 700; }
  h1 { margin: 2px 0 0; font-family: var(--f-display); font-size: 19px; font-weight: 700; letter-spacing: 0.05em; }
  .tag { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .search { position: relative; flex: 1 1 260px; max-width: 380px; pointer-events: auto; }
  .search input {
    width: 100%; height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: 600 15px var(--f-body);
  }
  .search input::placeholder { color: var(--muted); font-weight: 500; }
  .search input:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #res { list-style: none; margin: 6px 0 0; padding: 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); position: absolute; left: 0; right: 0; z-index: 5; }
  #res button { width: 100%; display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font: 600 14px var(--f-body); cursor: pointer; text-align: left; }
  #res button:hover { background: rgba(63, 208, 255, 0.12); }
  #res small { color: var(--muted); font-weight: 500; }
  .tools { display: flex; gap: 8px; pointer-events: auto; }
  .tools button {
    height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 600 14px var(--f-body); cursor: pointer;
  }
  .tools button:hover { border-color: var(--cyan); }
  .tools button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .legend { pointer-events: auto; display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); max-width: 100%; }
  .legend .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .legend b { color: var(--ink); font-weight: 600; margin-right: 2px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chip { padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; }
  .card { pointer-events: auto; position: relative; width: min(340px, 100%); padding: 14px 16px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); }
  .card .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  .card .x:hover { color: var(--ink); }

  @media (max-width: 700px) {

    .card { width: 100%; }
    .stage.has-card .legend { display: none; }
    .legend .levels { display: none; }
    .tools button { padding: 0 10px; }
    h1 { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .pill, .dist { transition: none; } }

  #gate { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(5,10,24,0.92); }
  #gate[hidden] { display: none; }
  #gate .box { max-width: 360px; width: 100%; text-align: center; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-solid); }
  #gate h2 { margin: 0 0 8px; font-family: var(--f-display); font-size: 18px; }
  #gate p { margin: 0 0 16px; color: var(--muted); }
  #gate button { height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--cyan); background: transparent; color: var(--ink); font: 700 15px var(--f-body); cursor: pointer; }
  #gate #gate-err { margin: 12px 0 0; color: var(--pres); font-size: 13px; }
</style>

<main class="stage" id="stage">
  <canvas id="gl" aria-label="Mapa de México en 3D con una ciudad espacial. Arrastra para girar, pellizca o usa la rueda para acercar."></canvas>
  <div id="labels"></div>
  <div class="hud">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">Atlas Earth AEMX</p>
        <h1>Mapa espacial</h1>
        <p class="tag">Cargando datos…</p>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="Busca un gamertag o ciudad" autocomplete="off" aria-label="Buscar jugador o ciudad">
        <ul id="res" hidden></ul>
      </div>
      <div class="tools">
        <button type="button" id="b-over">México</button>
        <button type="button" id="b-pal">Palacio</button>
      </div>
    </header>
    <footer class="bottom">
      <aside class="card" id="card" hidden>
        <button type="button" class="x" id="cx" aria-label="Cerrar">×</button>
        <span class="rank" id="c-rank"></span>
        <h2 id="c-name"></h2>
        <p class="meta" id="c-meta"></p>
        <div class="total"><span id="c-total"></span><small>parcelas</small></div>
        <div class="bar" id="c-bar"></div>
        <ul class="rows" id="c-rows"></ul>
        <p class="lvl" id="c-lvl"></p>
      </aside>
    </footer>
  </div>
  <div id="fail" hidden><p>No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la página.</p></div>
</main>

<div id="gate">
  <div class="box">
    <h2>Mapa espacial AEMX</h2>
    <p id="gate-msg">Inicia sesión con Google para ver a los jugadores en el mapa.</p>
    <button type="button" id="gate-btn">Iniciar con Google</button>
    <p id="gate-err" hidden></p>
  </div>
</div>

      if (!ws || !ws.length) continue;
      near = camera.position.distanceTo(wTmp.set(d.cx, 0, d.cz)) < d.r + 170;
      for (wi = 0; wi < ws.length; wi++) { if (ws[wi].g.visible !== near) ws[wi].g.visible = near; }
      if (!near) continue;

      /* 1) Enfriamiento, golpes recibidos y fin de encuentros (al terminar se dan la vuelta y se separan) */
      for (wi = 0; wi < ws.length; wi++) {
        w = ws[wi];
        if (w.cd > 0) w.cd -= dt;
        if (w.hit > 0) w.hit = Math.max(0, w.hit - dt / 0.35);
        if (w.state !== 'walk') {
          w.stT -= dt;
          if (w.stT <= 0) {
            w.state = 'walk'; w.partner = null; w.wait = 0;
            w.cd = 5 + Math.random() * 4;
            poseReset(w);
            reverseWalker(w);
          }
        }
      }

      /* 2) Nuevos encuentros: pelea o saludo al azar */
      for (wi = 0; wi < ws.length; wi++) {
        w = ws[wi];
        if (w.state !== 'walk' || w.cd > 0) continue;
        for (wj = wi + 1; wj < ws.length; wj++) {
          o = ws[wj];
          if (o.state !== 'walk' || o.cd > 0) continue;
          if (Math.hypot(o.bx - w.bx, o.bz - w.bz) < W_MEET) {
            kind = Math.random() < 0.5 ? 'fight' : 'greet';
            dur = kind === 'fight' ? 2.2 + Math.random() * 0.9 : 1.5 + Math.random() * 0.5;
            w.state = kind; o.state = kind;
            w.stT = dur; o.stT = dur;
            w.partner = o; o.partner = w;
            w.pT = 99; o.pT = 99; w.pGap = 0; o.pGap = 0.15;
            w.pArm = Math.random() < 0.5; o.pArm = !w.pArm;
            w.boom = false; o.boom = false;
            w.lose = Math.random() < 0.5; o.lose = !w.lose;
            if (kind === 'greet') spawnFx('heart', (w.bx + o.bx) / 2, (w.bz + o.bz) / 2);
            break;
          }
        }
      }

      /* 3) Movimiento y poses */
      for (wi = 0; wi < ws.length; wi++) {
        w = ws[wi];
        offT = 0; leanT = 0;
        if (w.state === 'walk') {
          len = w.len;
          ux = len > 0 ? (w.to.x - w.from.x) / len : 0;
          uz = len > 0 ? (w.to.z - w.from.z) / len : 0;
          blocked = false; sameDir = false;
          for (wj = 0; wj < ws.length; wj++) {
            if (wj === wi) continue;
            o = ws[wj];
            dx = o.bx - w.bx; dz = o.bz - w.bz;
            dist = Math.hypot(dx, dz);
            if (dist < W_BLOCK && dist > 0.001 && (ux * dx + uz * dz) / dist > 0.35) {
              blocked = true;
              if (o.state === 'walk' && o.len > 0 &&
                  ((o.to.x - o.from.x) * ux + (o.to.z - o.from.z) * uz) / o.len > 0.5) sameDir = true;
              break;
            }
          }
          if (blocked) {
            /* Alguien le cierra el paso: espera; si no va en su misma dirección, da la vuelta */
            w.wait += dt;
            if (!sameDir && w.wait > 1.5) { reverseWalker(w); w.wait = 0; }
            poseReset(w);
            w.g.position.y = 0.14;
          } else {
            w.wait = 0;
            w.prog += w.speed * dt;
            if (w.prog >= w.len) {
              var opts = w.to.n.filter(function (v) { return v !== w.from; });
              if (!opts.length) opts = w.to.n;
              w.prev = w.from; w.from = w.to;
              w.to = opts[Math.floor(Math.random() * opts.length)];
              w.len = Math.hypot(w.to.x - w.from.x, w.to.z - w.from.z);
              w.prog = 0;
            }
            f = w.len > 0 ? w.prog / w.len : 0;
            w.bx = w.from.x + (w.to.x - w.from.x) * f;
            w.bz = w.from.z + (w.to.z - w.from.z) * f;
            sw = Math.sin(t * 7 * (w.speed / 2) + w.phase) * 0.7;
            w.parts.legL.rotation.x = sw; w.parts.legR.rotation.x = -sw;
            w.parts.armL.rotation.x = -sw * 0.8; w.parts.armR.rotation.x = sw * 0.8;
            w.parts.armL.rotation.z = 0; w.parts.armR.rotation.z = 0;
            w.g.position.y = 0.14 + Math.abs(Math.sin(t * 7 * (w.speed / 2) + w.phase)) * 0.04;
          }
          turnToward(w, w.to.x - w.from.x, w.to.z - w.from.z, dt);
        } else {
          p = w.partner;
          turnToward(w, p.bx - w.bx, p.bz - w.bz, dt);
          if (w.state === 'fight') {
            /* Golpes secos con pausas irregulares; algunos conectan y hacen tambalear al rival */
            w.pT += dt;
            if (w.pT >= PUNCH_DUR + w.pGap) {
              w.pT = 0; w.pGap = 0.1 + Math.random() * 0.45; w.pArm = !w.pArm;
              if (Math.random() < 0.6) p.hit = 1;
            }
            pr = w.pT < 0.07 ? w.pT / 0.07 : (w.pT < 0.13 ? 1 : (w.pT < PUNCH_DUR ? 1 - (w.pT - 0.13) / 0.09 : 0));
            w.parts.armR.rotation.x = w.pArm ? -1.55 * pr : -0.7;
            w.parts.armL.rotation.x = w.pArm ? -0.7 : -1.55 * pr;
            w.parts.armL.rotation.z = 0; w.parts.armR.rotation.z = 0;
            w.parts.legL.rotation.x = 0.25; w.parts.legR.rotation.x = -0.25;
            offT = 0.15 + 0.12 * pr - 0.35 * w.hit;
            leanT = -0.4 * w.hit;
            if (w.stT < 0.8) {
              /* Final: hongo entre los dos y el perdedor sale despedido hacia atrás */
              if (!w.boom) { w.boom = true; p.boom = true; spawnFx('mush', (w.bx + p.bx) / 2, (w.bz + p.bz) / 2); }
              if (w.lose) { offT = -0.45; leanT = -0.6; }
            }
            w.g.position.y = 0.14 + pr * 0.03;
          } else {
            /* Saludo: se acercan un poco y uno agita el brazo */
            w.parts.legL.rotation.x = 0; w.parts.legR.rotation.x = 0;
            w.parts.armL.rotation.x = 0; w.parts.armL.rotation.z = 0;
            w.parts.armR.rotation.x = -2.6;
            w.parts.armR.rotation.z = Math.sin(t * 12 + w.phase) * 0.45;
            offT = 0.12;
            w.g.position.y = 0.14;
          }
        }
        w.off += (offT - w.off) * Math.min(1, dt * 12);
        w.lean += (leanT - w.lean) * Math.min(1, dt * 12);
        w.g.rotation.x = w.lean;
        w.g.position.x = w.bx + Math.sin(w.yaw) * w.off;
        w.g.position.z = w.bz + Math.cos(w.yaw) * w.off;
      }
    }
    updateFx(dt);
  }

  /* Farolas con instancias */
  (function () {
    var n = lampPos.length;
    var poles = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.05, 0.05, 1.1, 6), new THREE.MeshLambertMaterial({ color: 0x6b86b4 }), n);
    var bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.2, 8, 6), new THREE.MeshBasicMaterial({ color: 0x3fd0ff }), n);
    var o = new THREE.Object3D(), q;
    for (q = 0; q < n; q++) {
      o.position.set(lampPos[q][0], 0.14 + 0.55, lampPos[q][1]); o.updateMatrix(); poles.setMatrixAt(q, o.matrix);
      o.position.set(lampPos[q][0], 0.14 + 1.15, lampPos[q][1]); o.updateMatrix(); bulbs.setMatrixAt(q, o.matrix);
    }
    poles.instanceMatrix.needsUpdate = true;
    bulbs.instanceMatrix.needsUpdate = true;
    scene.add(poles);
    scene.add(bulbs);
  })();

  /* Marcadores que crecen con la distancia para verse desde todo el país */
  var pinGeoCone = new THREE.ConeGeometry(0.9, 3.2, 10);
  var pinGeoBall = new THREE.SphereGeometry(1.25, 14, 10);
  function makePin(color) {
    var g = new THREE.Group();
    var cone = new THREE.Mesh(pinGeoCone, new THREE.MeshBasicMaterial({ color: color }));
    cone.rotation.x = Math.PI;
    cone.position.y = 1.6;
    var ball = new THREE.Mesh(pinGeoBall, new THREE.MeshBasicMaterial({ color: color }));
    ball.position.y = 4.4;
    g.add(cone);
    g.add(ball);
    scene.add(g);
    return g;
  }
  var pinRoots = [];
  districts.forEach(function (d) {
    d.pin = makePin(0x3fd0ff);
    d.pin.userData.d = d;
    pinRoots.push(d.pin);
    d.pin.position.set(d.cx, 0.35, d.cz);
    d.pinPos = new THREE.Vector3(d.cx, 0.35, d.cz);
  });
  var presPin = makePin(0xfacc15);
  presPin.position.set(presPos.x, 0.35, presPos.z);
  presPin.userData.pres = true;
  pinRoots.push(presPin);
  var presPinPos = new THREE.Vector3(presPos.x, 0.35, presPos.z);

  /* Anillo de selección */
  var selRing = new THREE.Mesh(new THREE.TorusGeometry(3.9, 0.12, 8, 64), new THREE.MeshBasicMaterial({ color: 0x3fd0ff }));
  selRing.rotation.x = Math.PI / 2;
  selRing.visible = false;
  scene.add(selRing);

  /* ---------- Etiquetas ---------- */
  var labelsEl = document.getElementById('labels');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var selected = null;
  players.forEach(function (p) {
    var b = el('button', 'pill' + (p.isPres ? ' pres' : ''));
    b.type = 'button';
    b.tabIndex = -1;
    if (p.isPres) b.appendChild(el('em', null, 'Presidente'));
    b.appendChild(el('span', null, '@' + p.name));
    b.appendChild(el('small', null, p.city));
    b.addEventListener('click', function () { select(p); });
    labelsEl.appendChild(b);
    p.pill = b;
    p.wpos = new THREE.Vector3(p.x, p.topY + 1.3, p.z);
  });
  districts.forEach(function (d) {
    var e = el('div', 'dist');
    e.appendChild(document.createTextNode(d.name));
    e.appendChild(el('small', null, d.list.length + (d.list.length === 1 ? ' jugador' : ' jugadores')));
    labelsEl.appendChild(e);
    e.setAttribute('role', 'button');
    e.tabIndex = 0;
    e.addEventListener('click', function () { flyToDistrict(d); });
    e.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') flyToDistrict(d); });
    d.el = e;
    d.wpos = new THREE.Vector3(d.cx, 8, d.cz);
  });

  /* ---------- Cámara ---------- */
  var fly = null, rotOn = false, SW = 1, SH = 1;
  function setRot() { rotOn = false; }
  controls.addEventListener('start', function () { setRot(false); fly = null; });

  function overviewDist() {
    var aspect = SW / SH;
    return 3700 * Math.max(1, 1.15 / aspect);
  }
  function flyTo(tx, ty, tz, dist, phi) {
    var to = new THREE.Vector3(tx, ty, tz);
    var s = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    s.radius = dist;
    s.phi = phi;
    var pos = to.clone().add(new THREE.Vector3().setFromSpherical(s));
    fly = { t: 0, dur: REDUCED ? 0.01 : 1.4, fa: controls.target.clone(), fb: to, pa: camera.position.clone(), pb: pos };
  }
  function overview() { deselect(); flyTo(0, 0, 0, overviewDist(), 0.6); }
  function flyToDistrict(d) { deselect(); flyTo(d.cx, 0, d.cz, Math.max(90, d.r * 2.8), 0.95); }

  function resize() {
    SW = Math.max(1, stage.clientWidth);
    SH = Math.max(1, stage.clientHeight);
    renderer.setSize(SW, SH, false);
    camera.aspect = SW / SH;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  (function () {
    var d = overviewDist();
    camera.position.set(0, d * Math.cos(0.6), d * Math.sin(0.6));
    controls.target.set(0, 0, 0);
    controls.update();
  })();

  /* ---------- Selección y tarjeta ---------- */
  var card = document.getElementById('card');
  var RAR = [['Común', 'common', 'var(--common)'], ['Rara', 'rare', 'var(--rare)'], ['Épica', 'epic', 'var(--epic)'], ['Legendaria', 'legendary', 'var(--legend)']];

  function select(p) {
    if (selected && selected.pill) selected.pill.classList.remove('sel');
    selected = p;
    p.pill.classList.add('sel');
    selRing.visible = true;
    selRing.position.set(p.x, BASE + 0.08, p.z);
    selRing.scale.setScalar(p.isPres ? 1.9 : 1);

    var rk = document.getElementById('c-rank');
    rk.textContent = p.isPres ? 'Presidente de México' : 'Puesto ' + p.rank + ' de ' + players.length;
    rk.className = 'rank' + (p.isPres ? ' pres' : '');
    document.getElementById('c-name').textContent = '@' + p.name;
    document.getElementById('c-meta').textContent = p.city + ' · México';
    document.getElementById('c-total').textContent = fmt(p.total);
    var bar = document.getElementById('c-bar'), rows = document.getElementById('c-rows');
    bar.textContent = ''; rows.textContent = '';
    RAR.forEach(function (r) {
      var n = p[r[1]];
      var seg = el('span');
      seg.style.width = (n / p.total * 100) + '%';
      seg.style.background = r[2];
      bar.appendChild(seg);
      var li = el('li');
      var left = el('span');
      var dot = el('i', 'dot');
      dot.style.background = r[2];
      left.appendChild(dot);
      left.appendChild(document.createTextNode(r[0]));
      li.appendChild(left);
      li.appendChild(el('span', null, fmt(n)));
      rows.appendChild(li);
    });
    document.getElementById('c-lvl').textContent = 'Nivel: ' + TIER_NAMES[p.tier] + ' (' + TIER_RANGE[p.tier] + ' parcelas)';
    card.hidden = false;
    stage.classList.add('has-card');
    setRot(false);
    flyTo(p.x, p.topY * 0.35, p.z, p.tier === 5 ? 42 : 28, 0.95);
  }
  function deselect() {
    if (selected && selected.pill) selected.pill.classList.remove('sel');
    selected = null;
    selRing.visible = false;
    card.hidden = true;
    stage.classList.remove('has-card');
  }
  document.getElementById('cx').addEventListener('click', deselect);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { deselect(); resEl.hidden = true; } });
  document.getElementById('b-over').addEventListener('click', overview);
  document.getElementById('b-pal').addEventListener('click', function () { select(pres); });

  /* Búsqueda de jugadores y ciudades */
  var q = document.getElementById('q'), resEl = document.getElementById('res'), matches = [];
  function choose(m) {
    if (m.kind === 'd') flyToDistrict(m.d); else select(m.p);
    resEl.hidden = true; q.value = ''; q.blur();
  }
  q.addEventListener('input', function () {
    var v = q.value.trim().replace(/^@/, '').toLowerCase();
    resEl.textContent = '';
    if (!v) { resEl.hidden = true; matches = []; return; }
    matches = [];
    districts.forEach(function (d) { if (d.name.toLowerCase().indexOf(v) > -1) matches.push({ kind: 'd', d: d, label: d.name, sub: 'ver ciudad' }); });
    players.forEach(function (p) {
      if (matches.length < 6 && (p.name.toLowerCase().indexOf(v) > -1 || p.city.toLowerCase().indexOf(v) > -1)) matches.push({ kind: 'p', p: p, label: '@' + p.name, sub: p.city });
    });
    matches = matches.slice(0, 6);
    if (!matches.length) {
      var none = el('li');
      none.appendChild(el('small', null, 'Sin resultados'));
      none.style.padding = '8px 10px';
      resEl.appendChild(none);
    }
    matches.forEach(function (m) {
      var li = el('li');
      var b = el('button');
      b.type = 'button';
      b.appendChild(el('span', null, m.label));
      b.appendChild(el('small', null, m.sub));
      b.addEventListener('click', function () { choose(m); });
      li.appendChild(b);
      resEl.appendChild(li);
    });
    resEl.hidden = false;
  });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && matches.length) choose(matches[0]);
  });

  /* Clic sobre edificios */
  var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), downAt = null;
  canvas.addEventListener('pointerdown', function (e) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (!downAt) return;
    var dx = e.clientX - downAt.x, dy = e.clientY - downAt.y, dt = performance.now() - downAt.t;
    downAt = null;
    if (dx * dx + dy * dy > 25 || dt > 400) return;
    var rect = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var ph = raycaster.intersectObjects(pinRoots, true);
    for (var pi = 0; pi < ph.length; pi++) {
      var po = ph[pi].object;
      while (po && !(po.userData && (po.userData.d || po.userData.pres))) po = po.parent;
      if (po && po.visible) {
        if (po.userData.pres) select(pres); else flyToDistrict(po.userData.d);
        return;
      }
    }
    var hits = raycaster.intersectObjects(roots, true);
    if (!hits.length) return;
    var o = hits[0].object;
    while (o && !(o.userData && o.userData.p)) o = o.parent;
    if (o) select(o.userData.p);
  });

  /* ---------- Bucle ---------- */
  var clock = new THREE.Clock(), tmp = new THREE.Vector3();
  var LABEL_D = 55, DIST_NEAR = 60, PIN_D = 140;

  function placeLabel(node, wpos, show, rects, readonly) {
    tmp.copy(wpos).project(camera);
    var inView = tmp.z < 1 && tmp.x > -1.1 && tmp.x < 1.1 && tmp.y > -1.1 && tmp.y < 1.1;
    if (!show || !inView) {
      node.style.opacity = '0';
      node.style.visibility = 'hidden';
      return;
    }
    var sx = (tmp.x * 0.5 + 0.5) * SW, sy = (-tmp.y * 0.5 + 0.5) * SH;
    if (rects) {
      var w = node._w || (node._w = node.offsetWidth || 90), h = node._h || (node._h = node.offsetHeight || 34);
      var r = [sx - w / 2 - 4, sy - h - 2, sx + w / 2 + 4, sy + 2], j, hit = false;
      for (j = 0; j < rects.length; j++) {
        var o = rects[j];
        if (r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]) { hit = true; break; }
      }
      if (hit) { node.style.opacity = '0'; node.style.visibility = 'hidden'; return; }
      if (!readonly) rects.push(r);
    }
    node.style.visibility = 'visible';
    node.style.opacity = '1';
    node.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
    node.style.zIndex = String(Math.max(1, 1000 - Math.round(Math.min(camera.position.distanceTo(wpos), 990))));
  }

  function blockedRects() {
    var out = [], sr = stage.getBoundingClientRect();
    ['.top', '#legend', '#card'].forEach(function (sel) {
      var e = document.querySelector(sel);
      if (!e || e.hidden) return;
      var b = e.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      out.push([b.left - sr.left - 6, b.top - sr.top - 6, b.right - sr.left + 6, b.bottom - sr.top + 6]);
    });
    return out;
  }

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k, n;

    if (fly) {
      fly.t = Math.min(1, fly.t + dt / fly.dur);
      k = fly.t * fly.t * (3 - 2 * fly.t);
      controls.target.lerpVectors(fly.fa, fly.fb, k);
      camera.position.lerpVectors(fly.pa, fly.pb, k);
      if (fly.t >= 1) fly = null;
    }
    controls.autoRotate = rotOn && !fly && !selected;
    controls.update();
    controls.target.x = clamp(controls.target.x, -1750, 1750);
    controls.target.z = clamp(controls.target.z, -1300, 1300);
    controls.target.y = clamp(controls.target.y, 0, 60);

    sun.target.position.copy(controls.target);
    sun.position.copy(controls.target).add(SUN_OFF);

    for (n = 0; n < spinners.length; n++) spinners[n].obj.rotation.y += spinners[n].speed * dt;
    updateWalkers(dt, t);
    for (n = 0; n < blinkers.length; n++) blinkers[n].mesh.scale.setScalar(0.85 + 0.35 * Math.sin(t * 3 + blinkers[n].phase));
    updateCyber(t);
    if (selected) selRing.rotation.z = t * 0.8;

    var rects = blockedRects();
    for (n = 0; n < players.length; n++) {
      var p = players[n];
      var d = camera.position.distanceTo(p.wpos);
      placeLabel(p.pill, p.wpos, (p.isPres && d < 220) || p === selected || d < LABEL_D, p === selected ? null : rects, true);
    }
    if (!districts._order) districts._order = districts.slice().sort(function (a, b) { return b.list.length - a.list.length; });
    for (n = 0; n < districts.length; n++) {
      var dd = districts[n];
      var d0 = camera.position.distanceTo(dd.pinPos);
      var s = Math.max(1, d0 / 90);
      dd.pin.scale.setScalar(s);
      dd.pin.visible = d0 > PIN_D;
      dd.wpos.y = 0.35 + 6.6 * (d0 > PIN_D ? s : 1);
    }
    for (n = 0; n < districts._order.length; n++) {
      var d1 = districts._order[n];
      placeLabel(d1.el, d1.wpos, camera.position.distanceTo(d1.pinPos) > DIST_NEAR, rects);
    }
    var dp = camera.position.distanceTo(presPinPos);
    presPin.scale.setScalar(Math.max(1, dp / 90) * 1.3);
    presPin.visible = dp > PIN_D;

    renderer.render(scene, camera);
  }
  frame();
};

});
const auth = getAuth(app);
const db = getDatabase(app);
const gate = document.getElementById('gate');
const btn = document.getElementById('gate-btn');
const msg = document.getElementById('gate-msg');
const err = document.getElementById('gate-err');
let started = false;

function showErr(t) { err.textContent = t; err.hidden = false; }

btn.addEventListener('click', async () => {
  err.hidden = true;
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { showErr('No se pudo iniciar sesión: ' + (e.code || e.message)); }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) { gate.hidden = false; btn.hidden = false; msg.textContent = 'Inicia sesión con Google para ver a los jugadores en el mapa.'; return; }
  if (started) return;
  btn.hidden = true; msg.textContent = 'Cargando jugadores…';
  try {
    const snap = await get(ref(db, 'users'));
    started = true;
    gate.hidden = true;
    window.startMap(snap.val() || {});
  } catch (e) {
    btn.hidden = false;
    msg.textContent = 'No se pudieron leer los datos.';
    showErr(e.code || e.message);
  }
});
</script>

</body></html>
