<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>CHAT - ATLAS EARTH MÉXICO</title><!-- v2.2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00ffff;
            --accent-color: #ffff00;
            --danger-color: #ff0066;
            --bg-dark: #0a0e1a;
            --bg-panel: #0f1419;
            --text-primary: #ffffff;
            --text-secondary: #8f9bb3;
            --border-color: var(--primary-color);
        }
        body.theme-cyan { --primary-color:#00ffff;--secondary-color:#00aaff;--accent-color:#0088ff; }
        body.theme-purple { --primary-color:#aa00ff;--secondary-color:#ff00ff;--accent-color:#ff00aa; }
        body.theme-orange { --primary-color:#ff8800;--secondary-color:#ffaa00;--accent-color:#ffdd00; }
        body { font-family:'Rajdhani',sans-serif;background:var(--bg-dark);color:var(--text-primary);overflow:hidden;height:100vh;position:relative; }
        body::before { content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(var(--primary-color) 1px,transparent 1px),linear-gradient(90deg,var(--primary-color) 1px,transparent 1px);background-size:50px 50px;opacity:.03;pointer-events:none;z-index:0; }
        .chat-container { display:grid;grid-template-columns:1fr;height:100vh;position:relative;z-index:1; }
        .sidebar { background:var(--bg-panel);border-right:2px solid var(--border-color);box-shadow:0 0 20px rgba(0,255,136,.3);display:flex;flex-direction:column;position:relative;overflow:hidden; }
        .sidebar::before { content:'';position:absolute;top:0;right:0;width:2px;height:100%;background:linear-gradient(180deg,transparent 0%,var(--primary-color) 50%,transparent 100%);animation:borderPulse 3s ease-in-out infinite;pointer-events:none; }
        @keyframes borderPulse { 0%,100%{opacity:.3} 50%{opacity:1} }
        .sidebar-header { padding:24px;border-bottom:2px solid var(--border-color);background:linear-gradient(135deg,rgba(0,255,136,.1) 0%,transparent 100%);position:relative; }
        .sidebar-header::after { content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--primary-color);box-shadow:0 0 10px var(--primary-color);pointer-events:none; }
        .sidebar-title { font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;letter-spacing:2px;color:var(--primary-color);text-transform:uppercase;text-shadow:0 0 10px var(--primary-color);margin-bottom:8px; }
        .online-status { display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px; }
        .status-dot { width:8px;height:8px;background:var(--primary-color);border-radius:50%;animation:pulse 2s ease-in-out infinite;box-shadow:0 0 10px var(--primary-color); }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.2);opacity:.7} }
        .guides-list { flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;pointer-events:all;position:relative;z-index:10; }
        .guide-item { display:flex;align-items:center;gap:10px;padding:11px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(0,255,136,.35);border-radius:6px;text-decoration:none;color:var(--text-primary);transition:all .2s ease;position:relative;overflow:hidden;pointer-events:all;cursor:pointer;-webkit-tap-highlight-color:rgba(0,255,136,.2);touch-action:manipulation; }
        .guide-item::before { content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary-color);transform:scaleY(0);transition:transform .2s ease;pointer-events:none; }
        .guide-item:hover { background:rgba(0,255,136,.12);border-color:var(--primary-color);transform:translateX(4px);box-shadow:0 0 12px rgba(0,255,136,.15); }
        .guide-item:hover::before { transform:scaleY(1); }
        .guide-item-icon { font-size:18px;width:32px;text-align:center;flex-shrink:0; }
        .guide-item-text { flex:1;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--text-primary);transition:color .2s;line-height:1.3; }
        .guide-item-arrow { font-size:18px;color:var(--primary-color);transition:all .2s;flex-shrink:0;opacity:.7; }
        .guide-item:hover .guide-item-arrow { transform:translateX(3px); }
        .chat-main { display:flex;flex-direction:column;background:var(--bg-dark);position:relative;height:100dvh;overflow:hidden; }
        .chat-header { padding:20px 32px;border-bottom:2px solid var(--border-color);background:var(--bg-panel);box-shadow:0 0 20px rgba(0,255,136,.2);position:relative; }
        .chat-header::after { content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--primary-color) 50%,transparent 100%);animation:headerGlow 3s ease-in-out infinite; }
        @keyframes headerGlow { 0%,100%{opacity:.3} 50%{opacity:1} }

        /* ── Header row ── */
        .chat-header-content { display:flex;justify-content:center;align-items:center;gap:6px;overflow-x:auto;overflow-y:visible;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px; }
        .chat-header-content::-webkit-scrollbar { display:none; }

        /* Spacer empuja cerrar a la derecha */
        .header-spacer { flex:0;min-width:0; }

        /* ── BOTÓN CERRAR ── */
        .btn-close-chat { display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;background:rgba(255,60,80,.1);border:1px solid rgba(255,60,80,.45);border-radius:8px;color:#ff5566;font-size:16px;line-height:1;cursor:pointer;transition:all .2s ease; }
        .btn-close-chat:hover { background:rgba(255,60,80,.28);border-color:#ff5566;color:#fff;box-shadow:0 0 14px rgba(255,60,80,.5);transform:scale(1.1); }
        .btn-close-chat:active { transform:scale(.93); }

        .btn-guias { display:flex;align-items:center;justify-content:center;background:none;border:1px solid #00ff9d;border-radius:8px;color:#00ff9d;font-size:16px;width:32px;height:32px;cursor:pointer;transition:all .2s;text-decoration:none;flex-shrink:0; }
        .btn-guias:hover { background:#00ff9d;color:#060b14;box-shadow:0 0 16px rgba(0,255,157,.4); }
        .btn-leaderboard { display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--primary-color);border-radius:8px;color:var(--primary-color);font-size:16px;width:32px;height:32px;cursor:pointer;transition:all .2s;text-decoration:none;flex-shrink:0; }
        .btn-leaderboard:hover { background:var(--primary-color);color:#060b14;box-shadow:0 0 16px rgba(0,255,136,.4); }
        .btn-transacciones { display:flex;align-items:center;justify-content:center;background:none;border:1px solid #ffd700;border-radius:8px;color:#ffd700;font-size:16px;width:32px;height:32px;cursor:pointer;transition:all .2s;text-decoration:none;flex-shrink:0; }
        .btn-transacciones:hover { background:#ffd700;color:#060b14;box-shadow:0 0 16px rgba(255,215,0,.4); }
        .btn-transacciones.hidden { display:none; }
        .btn-presencia { display:flex;align-items:center;gap:6px;background:none;border:1px solid #00ff9d;border-radius:8px;color:#00ff9d;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;text-decoration:none; }
        .btn-presencia:hover { background:#00ff9d;color:#060b14;box-shadow:0 0 16px rgba(0,255,157,.4); }
        .btn-mute { display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border-color,#1a3a5c);border-radius:8px;color:var(--text-secondary,#6b8ab0);font-size:14px;width:32px;height:32px;cursor:pointer;transition:all .2s;flex-shrink:0; }
        .btn-mute:hover { border-color:#ffd700;color:#ffd700; }
        .btn-mute.muted { border-color:#ff4466;color:#ff4466; }
        .chat-header h2 { font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:3px;color:var(--primary-color);text-transform:uppercase;text-shadow:0 0 15px var(--primary-color); }
        .chat-subtitle { font-size:12px;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:1px; }
        .messages-container { flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px; }
        .message { display:flex;gap:8px;animation:messageSlide .3s ease-out;align-items:flex-end;max-width:80%; }
        .message-system-feed {
            display:flex;align-items:center;justify-content:center;gap:8px;
            align-self:center;max-width:92%;
            animation:messageSlide .3s ease-out;
        }
        .message-system-feed + .message-system-feed { margin-top: -14px; }
        .message-system-feed-text {
            font-size:12px;font-weight:700;color:#ff8c00;text-align:center;
            text-shadow:0 0 6px rgba(255,140,0,.4);
        }
        .message { align-self:flex-start;flex-direction:row; }
        .message.own { align-self:flex-end;flex-direction:row-reverse; }
        @keyframes messageSlide { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .message-avatar { width:32px;height:32px;min-width:32px;min-height:32px;aspect-ratio:1/1;border-radius:50%;border:2px solid var(--primary-color);background:rgba(0,255,136,.08);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 8px rgba(0,255,136,.3); }
        .message-content { display:flex;flex-direction:column;gap:2px; }
        .message.own .message-content { align-items:flex-end; }
        .message-author { font-weight:700;font-size:11px;color:var(--primary-color);text-transform:uppercase;letter-spacing:.5px;padding:0 4px; }
        .message.own .message-author { display:none; }
        .message.own.admin-msg .message-author { display:flex; justify-content:flex-end; }
        /* ── Mensajes del ADMIN ── */
        .message.admin-msg .message-author { color:#ff4466; }
        .message.admin-msg:not(.own) .message-text { background:rgba(255,40,80,.10);border-color:rgba(255,40,80,.3);color:#ffe0e6; }
        .message.admin-msg.own .message-text { background:rgba(255,40,80,.15);border-color:rgba(255,40,80,.4);color:#ffe0e6; }
        .message.admin-msg .message-avatar { border-color:#ff4466;box-shadow:0 0 10px rgba(255,40,80,.5); }
        .admin-badge { font-size:9px;font-family:'Orbitron',sans-serif;letter-spacing:1px;color:#ff4466;border:1px solid #ff4466;border-radius:3px;padding:1px 4px;vertical-align:middle;margin-left:4px; }
        /* ── Mensajes del MODERADOR ── */
        .message.own.mod-msg .message-author { display:flex; justify-content:flex-end; }
        .message.mod-msg .message-author { color:#a855f7; }
        .message.mod-msg:not(.own) .message-text { background:rgba(168,85,247,.10);border-color:rgba(168,85,247,.3);color:#f0e0ff; }
        .message.mod-msg.own .message-text { background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:#f0e0ff; }
        .message.mod-msg .message-avatar { border-color:#a855f7;box-shadow:0 0 10px rgba(168,85,247,.5); }
        .mod-badge { font-size:9px;font-family:'Orbitron',sans-serif;letter-spacing:1px;color:#a855f7;border:1px solid #a855f7;border-radius:3px;padding:1px 4px;vertical-align:middle;margin-left:4px; }

        /* ── BOTÓN NOTIFICACIONES ── */
        .btn-notifications {
          position: relative;
          background: none;
          border: 1px solid rgba(0,255,136,.4);
          border-radius: 8px;
          padding: 0;
          width: 32px;
          height: 32px;
          font-size: 16px;
          cursor: pointer;
          transition: all .2s;
          color: var(--primary-color);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .btn-notifications:hover { background: rgba(0,255,136,.15); box-shadow: 0 0 10px rgba(0,255,136,.3); border-color: rgba(0,255,136,.6); }
        .notifications-badge {
          position: absolute;
          top: -8px;
          right: -8px;
          background: #ff4466;
          color: white;
          border-radius: 50%;
          width: 24px;
          height: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 11px;
          font-weight: bold;
          font-family: 'Rajdhani', sans-serif;
          box-shadow: 0 0 8px rgba(255,68,102,.6);
        }
        .notifications-badge.hidden { display: none; }

        /* ── MODAL NOTIFICACIONES ── */
        .notifications-modal {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,.7);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 200;
        }
        .notifications-modal.visible { display: flex; }
        .notifications-modal-content {
          background: var(--bg-panel);
          border: 2px solid var(--primary-color);
          border-radius: 10px;
          padding: 20px;
          width: 90%;
          max-width: 500px;
          max-height: 70vh;
          overflow-y: auto;
          box-shadow: 0 0 30px rgba(0,255,136,.3);
        }
        .notifications-modal-header {
          font-family: 'Orbitron', sans-serif;
          font-size: 18px;
          color: var(--primary-color);
          margin-bottom: 16px;
          text-transform: uppercase;
          letter-spacing: 2px;
          border-bottom: 1px solid rgba(0,255,136,.3);
          padding-bottom: 10px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .notifications-list { display: flex; flex-direction: column; gap: 10px; }
        .notification-item {
          background: rgba(0,255,136,.05);
          border: 1px solid rgba(0,255,136,.2);
          border-radius: 6px;
          padding: 12px;
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 10px;
        }
        .notification-content {
          flex: 1;
          color: var(--text-primary);
          font-family: 'Rajdhani', sans-serif;
          font-size: 13px;
          line-height: 1.5;
          word-break: break-word;
          white-space: pre-wrap;
        }
        .notification-date {
          font-size: 10px;
          color: var(--text-secondary);
          font-family: 'Share Tech Mono', monospace;
          white-space: nowrap;
        }
        .notification-delete {
          background: none;
          border: none;
          color: #ff4466;
          cursor: pointer;
          font-size: 14px;
          padding: 0;
          flex-shrink: 0;
          transition: all .2s;
        }
        .notification-delete:hover { color: #ff6688; }
        .notifications-empty {
          text-align: center;
          color: var(--text-secondary);
          padding: 20px;
          font-family: 'Rajdhani', sans-serif;
        }
        .btn-close-notifications {
          background: none;
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          cursor: pointer;
          padding: 6px 12px;
          border-radius: 4px;
          font-family: 'Rajdhani', sans-serif;
          transition: all .2s;
        }
        .btn-close-notifications:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .message-text { font-size:14px;line-height:1.5;color:var(--text-primary);background:var(--bg-dark);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:8px 14px;word-break:break-word;white-space:pre-wrap; }
        .message:not(.own) .message-text { border-bottom-left-radius:4px;background:rgba(255,255,255,.05); }
        .message.own .message-text { border-bottom-right-radius:4px;background:rgba(0,255,136,.12);border-color:rgba(0,255,136,.25);color:#e0ffe8; }
        .chat-input-container { padding:20px 32px;border-top:2px solid var(--border-color);background:var(--bg-panel);box-shadow:0 0 30px rgba(0,255,136,.2);position:relative; }
        .chat-input-container::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--primary-color) 50%,transparent 100%); }
        .input-wrapper { display:flex;gap:12px;align-items:center; }
        .chat-input { flex:1;background:rgba(255,255,255,.05);border:2px solid var(--border-color);border-radius:4px;padding:14px 18px;color:var(--text-primary);font-size:14px;font-family:'Rajdhani',sans-serif;outline:none;transition:all .3s ease;box-shadow:inset 0 0 10px rgba(0,0,0,.5); }
        .chat-input:focus { border-color:var(--primary-color);background:rgba(0,255,136,.05);box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 0 20px rgba(0,255,136,.3); }
        .chat-input::placeholder { color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;font-size:12px; }
        .send-button { background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border:none;padding:14px 32px;border-radius:4px;color:var(--bg-dark);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .3s ease;font-family:'Orbitron',sans-serif;box-shadow:0 0 20px rgba(0,255,136,.5);position:relative;overflow:hidden; }
        .send-button::before { content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.3);border-radius:50%;transform:translate(-50%,-50%);transition:width .6s,height .6s; }
        .send-button:hover::before { width:300px;height:300px; }
        .send-button:hover { transform:translateY(-2px);box-shadow:0 0 30px rgba(0,255,136,.8); }
        .send-button:active { transform:translateY(0); }
        .theme-selector { display:flex;gap:8px; }
        .theme-btn { width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:all .3s ease;position:relative; }
        .theme-btn:hover { transform:scale(1.1);border-color:rgba(255,255,255,.8); }
        .theme-btn.active { border-color:white;box-shadow:0 0 15px currentColor; }
        .theme-btn.green { background:linear-gradient(135deg,#00ff88,#00ffff); }
        .theme-btn.cyan { background:linear-gradient(135deg,#00ffff,#00aaff); }
        .theme-btn.purple { background:linear-gradient(135deg,#aa00ff,#ff00ff); }
        .theme-btn.orange { background:linear-gradient(135deg,#ff8800,#ffdd00); }
        .username-modal { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,14,26,.95);display:none;align-items:center;justify-content:center;z-index:1000; }
        .username-modal.visible { display:flex; }
        .auth-overlay { position:fixed;inset:0;background:rgba(10,14,26,.97);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px); }
        .auth-overlay.visible { display:flex; }
        .auth-box { background:#0f1419;border:1px solid var(--primary-color);border-radius:16px;padding:40px 36px;max-width:380px;width:90%;text-align:center;box-shadow:0 0 40px rgba(0,255,136,.15); }
        .auth-box h2 { font-family:'Orbitron',monospace;font-size:16px;color:var(--primary-color);letter-spacing:3px;margin-bottom:8px; }
        .auth-box p { font-family:'Rajdhani',sans-serif;color:var(--text-secondary);font-size:13px;margin-bottom:28px;letter-spacing:1px; }
        .auth-btn-google { display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 20px;background:linear-gradient(135deg,#1a3a5c,#0b1626);border:1px solid var(--primary-color);border-radius:10px;color:var(--primary-color);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;margin-bottom:12px; }
        .auth-btn-google:hover { background:var(--primary-color);color:#060b14; }
        .auth-error { margin-top:14px;font-family:'Rajdhani',sans-serif;font-size:12px;color:var(--danger-color);letter-spacing:1px;min-height:18px; }
        .username-form { background:var(--bg-panel);border:2px solid var(--primary-color);border-radius:8px;padding:40px;box-shadow:0 0 50px rgba(0,255,136,.5);max-width:400px;width:90%; }
        .username-form h3 { font-family:'Orbitron',sans-serif;font-size:24px;color:var(--primary-color);text-transform:uppercase;margin-bottom:24px;text-align:center;text-shadow:0 0 15px var(--primary-color); }
        .username-form input { width:100%;background:rgba(255,255,255,.05);border:2px solid var(--border-color);border-radius:4px;padding:14px 18px;color:var(--text-primary);font-size:16px;font-family:'Rajdhani',sans-serif;outline:none;margin-bottom:24px;text-transform:uppercase; }
        .username-form input:focus { border-color:var(--primary-color);box-shadow:0 0 20px rgba(0,255,136,.3); }
        .username-form button { width:100%;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border:none;padding:14px;border-radius:4px;color:var(--bg-dark);font-weight:700;font-size:16px;text-transform:uppercase;cursor:pointer;font-family:'Orbitron',sans-serif;box-shadow:0 0 20px rgba(0,255,136,.5); }
        .username-form button:hover { box-shadow:0 0 30px rgba(0,255,136,.8); }
        .ticker-bar { display:none;align-items:center;height:40px;background:linear-gradient(90deg,rgba(255,170,0,.15),rgba(255,170,0,.05));border-bottom:1px solid rgba(255,170,0,.4);overflow:hidden;position:relative;flex-shrink:0; }
        .ticker-bar.visible { display:flex; }
        .ticker-label { font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:#ffaa00;background:rgba(255,170,0,.2);border-right:1px solid rgba(255,170,0,.4);padding:0 10px;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;text-shadow:0 0 8px rgba(255,170,0,.6); }
        .ticker-track { flex:1;overflow:hidden;position:relative;height:100%; }
        .ticker-text { display:inline-block;white-space:nowrap;font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;letter-spacing:1px;color:#ffe066;line-height:40px;animation:tickerScroll 60s linear infinite; }
        @keyframes tickerScroll { 0%{transform:translateX(100vw)} 100%{transform:translateX(-100%)} }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:var(--bg-panel); }

<body>

                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onValue, serverTimestamp, onDisconnect, set, update, remove, get, query, limitToLast, orderByChild, endAt } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB-xx2PlBjvnHe0K7Bf1MspVqUlfjky0mk",
            authDomain: "aemx-chat.firebaseapp.com",
            databaseURL: "https://aemx-chat-default-rtdb.firebaseio.com",
            projectId: "aemx-chat",
            storageBucket: "aemx-chat.firebasestorage.app",
            messagingSenderId: "267113002594",
            appId: "1:267113002594:web:4099e7537d950f5753433b",
            measurementId: "G-K84EVPE46R"
        };

        const app = initializeApp(firebaseConfig, 'chat-app');
        const database = getDatabase(app);
        const auth = getAuth(app);
        const authOverlay = document.getElementById('authOverlay');

        function showAuthError(msg) { document.getElementById('authError').textContent = msg; }

        // Detecta si estamos dentro de un iframe
        const enIframe = window.self !== window.top;

        window.authWithGoogle = async function() {
            showAuthError('');
            try {
                const provider = new GoogleAuthProvider();
                // Siempre popup — nunca redirigir window.top para no destruir la sesión del padre
                await signInWithPopup(auth, provider).catch((err) => {
                    // Si el popup fue bloqueado, abrir el chat en ventana nueva
                    if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
                        window.open(window.location.href, '_blank');
                        showAuthError('Popup bloqueado. Se abrió el chat en una ventana nueva.');
                    } else {
                        throw err;
                    }
                });
            } catch(e) {
                showAuthError('Error al iniciar con Google. Intenta de nuevo.');
                console.error(e);
            }
        };

        window.showEmailForm = undefined;
        window.hideEmailForm = undefined;

        // ✅ Listener de visibilidad del botón COINS fuera de initChat
        // Se activa en cuanto carga el módulo, sin esperar login ni username
        onValue(ref(database, 'config/btnTransaccionesActivo'), (snap) => {
            const activo = snap.exists() ? snap.val() : false;
            // Guardar estado de config para combinarlo con el clan check
            window._transaccionesConfigActivo = activo;
            actualizarBtnTransacciones();
        });

        function actualizarBtnTransacciones() {
            const btn = document.getElementById('btnTransacciones');
            if (!btn) return;
            const configActivo = window._transaccionesConfigActivo === true;
            const esClan = window._userEsClan === true;
            btn.classList.toggle('hidden', !(configActivo && esClan));
        }
        window._actualizarBtnTransacciones = actualizarBtnTransacciones;
        window._fbGet = get;
        window._fbRef = ref;
        window._fbDatabase = database;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                get(ref(database, `users/${user.uid}`)).then(snap => {
                    if (snap.exists() && snap.val().bannedChat) {
                        authOverlay.classList.add('visible');
                        document.getElementById('authError').textContent = '⛔ Tu cuenta ha sido bloqueada del chat.';
                        return;
                    }
                    // ── Verificar clan para el botón de transacciones ──
                    const data = snap.exists() ? snap.val() : {};
                    const esClan = data.clanMember === true || data.role === 'admin' || data.role === 'moderator';
                    window._userEsClan = esClan;
                    actualizarBtnTransacciones();

                    authOverlay.classList.remove('visible');
                    initChat(user, data.role === 'moderator');
                }).catch(() => {
                    window._userEsClan = false;
                    actualizarBtnTransacciones();
                    authOverlay.classList.remove('visible');
                    initChat(user, false);
                });
            } else {
                // Sin sesión: ocultar botón
                window._userEsClan = false;
                actualizarBtnTransacciones();
                authOverlay.classList.add('visible');
            }
        });

        function initChat(firebaseUser, isModerator = false) {
            let currentUsername = '';
            let userId = '';
            const ADMIN_EMAIL = 'ingmarcosrodriguez31@gmail.com';
            const currentUserIsAdmin = firebaseUser.email === ADMIN_EMAIL;
            const currentUserIsModerator = !currentUserIsAdmin && isModerator === true;

            window._notifUid = firebaseUser.uid;
            loadNotificationsFromFirebase(firebaseUser.uid);

            window.setUsername = setUsername;
            window.sendMessage = sendMessage;
            window.handleKeyPress = handleKeyPress;
            window.changeTheme = changeTheme;

            function setUsername() {
                const input = document.getElementById('usernameInput');
                const username = input.value.trim().toUpperCase();
                if (username && username.length >= 3) {
                    currentUsername = username;
                    window._currentUsername = username;
                    userId = firebaseUser.uid;
                    document.getElementById('usernameModal').classList.remove('visible');
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    // document.getElementById('messageInput').focus(); // (desactivado para evitar teclado automático en móvil)
const userRef = ref(database, 'chat_presence/' + userId);
                    set(userRef, {
                        username: currentUsername,
                        timestamp: serverTimestamp()
                    });
                    onDisconnect(userRef).remove();
                    loadMessages();
                    loadUsers();
                } else {
                    alert('Por favor ingresa un nombre de al menos 3 caracteres');
                }
            }

            function loadMessages() {
                const messagesRef = ref(database, 'messages');
                // ✅ Limitar descarga: solo los últimos 50 mensajes
                const recentMessagesQuery = query(messagesRef, limitToLast(20));
                let lastMessageCount = 0;
                let chatInitialized = false;
                onValue(recentMessagesQuery, (snapshot) => {
                    const container = document.getElementById('messagesContainer');
                    // Guardar mensajes locales de Aura y mensajes @aura del usuario antes de limpiar
                    const auraMsgs = Array.from(container.querySelectorAll('.aura-msg'));
                    const auraUserMsgs = Array.from(container.querySelectorAll('.message')).filter(m => 
                        !m.classList.contains('aura-msg') && m.querySelector('.message-text') && 
                        m.querySelector('.message-text').textContent.toLowerCase().includes('@aura')
                    );
                    const localMsgs = [...auraMsgs, ...auraUserMsgs].sort((a, b) => {
                        const allMsgs = Array.from(container.children);
                        return allMsgs.indexOf(a) - allMsgs.indexOf(b);
                    });
                    container.innerHTML = '';
                    const messages = [];
                    snapshot.forEach((childSnapshot) => { messages.push({ key: childSnapshot.key, ...childSnapshot.val() }); });
                    messages.sort((a, b) => a.timestamp - b.timestamp);

                    // Conteo independiente de mensajes de feed (isSystem) — límite 5
                    const feedMsgs = messages.filter(m => m.isSystem === true).sort((a, b) => a.timestamp - b.timestamp);
                    if (feedMsgs.length > 5) {
                        const toDelete = feedMsgs.slice(0, feedMsgs.length - 5);
                        toDelete.forEach(m => remove(ref(database, 'messages/' + m.key)).catch(e => console.error('trim feed error:', e)));
                    }

                    const total = messages.length;
                    // ✅ Con lista limitada, detectamos novedad por el último mensaje
                    const newest = total ? messages[total - 1] : null;
                    const newestKey = newest ? newest.key : null;
                    const newestTs  = newest && newest.timestamp ? newest.timestamp : 0;

                    if (!window._lastNewestKey) window._lastNewestKey = null;
                    if (!window._lastNewestTs) window._lastNewestTs = 0;

                    if (chatInitialized && newestKey && newestKey !== window._lastNewestKey && newestTs >= window._lastNewestTs) {
                        if (newest.username !== currentUsername) window.playPopSound();
                    }
                    window._lastNewestKey = newestKey;
                    window._lastNewestTs  = newestTs;

                    lastMessageCount = total;
                    chatInitialized = true;

                    // No renderizar más de los últimos 5 mensajes de feed, aunque el borrado en Firebase aún no se haya confirmado
                    const feedKeysToShow = new Set(feedMsgs.slice(-5).map(m => m.key));

                    // ── Los avisos (feed) siempre arriba, máx. 5, y los mensajes de usuario siempre abajo. ──
                    // Se renderizan en dos bloques separados en vez de mezclarlos por orden cronológico.
                    const feedToRender = messages.filter(m => m.isSystem === true && feedKeysToShow.has(m.key));
                    const userMsgsToRender = messages.filter(m => m.isSystem !== true).slice(-20);

                    feedToRender.forEach((msg) => {
                        if (!msg.username || !msg.text) return;
                        addMessageToUI(msg.username, msg.text, msg.timestamp, false, '', false, msg.key, false, true);
                    });
                    userMsgsToRender.forEach((msg) => {
                        if (!msg.username || !msg.text) return;
                        const isAdminMsg = msg.isAdmin === true || (currentUserIsAdmin && msg.username === currentUsername);
                        const isModeratorMsg = !isAdminMsg && (msg.isModerator === true || (currentUserIsModerator && msg.username === currentUsername));
                        addMessageToUI(msg.username, msg.text, msg.timestamp, msg.username === currentUsername, msg.borderColor || '', isAdminMsg, msg.key, isModeratorMsg, false);
                    });

            function loadUsers() {

            const MAX_MESSAGES = 20;

            async function sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                if (message && currentUsername) {

                    // ── Mensajes @aura: solo locales, no suben a Firebase ──
                    if (message.toLowerCase().includes('@aura')) {
                        const container = document.getElementById('messagesContainer');
                        addMessageToUI(currentUsername, message, Date.now(), true, '', currentUserIsAdmin, '', currentUserIsModerator);
                        const msgDiv = container.lastElementChild;
                        input.value = '';
                        if (window._auraCheckMessage) window._auraCheckMessage(message, true);
                        // Auto-borrar igual que los mensajes de Aura
                        if (msgDiv) {
                            setTimeout(() => {
                                if (msgDiv.parentNode) {
                                    msgDiv.style.transition = 'opacity 0.5s ease';
                                    msgDiv.style.opacity = '0';
                                    setTimeout(() => { if (msgDiv.parentNode) msgDiv.parentNode.removeChild(msgDiv); }, 500);

                            }, 3 * 60 * 1000);

                    await push(ref(database, 'messages'), {
                        username: currentUsername,
                        text: message,
                        timestamp: serverTimestamp(),
                        ...(currentUserIsAdmin && { isAdmin: true }),
                        ...(currentUserIsModerator && { isModerator: true }),

                    input.value = '';

                    // Borrar el más antiguo si hay más de MAX_MESSAGES
                    try {
                        const snap = await get(query(ref(database, 'messages'), orderByChild('timestamp'), limitToLast(MAX_MESSAGES + 1)));
                        if (snap.size > MAX_MESSAGES) {
                            let oldest = null;
                            snap.forEach(child => { if (!oldest) oldest = child; });

            function addMessageToUI(author, text, timestamp, isOwn = false, msgBorderColor = '', isAdmin = false, msgKey = '', isModerator = false, isSystem = false) {

                        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

            function changeTheme(theme) {
                document.body.className = theme ? `theme-${theme}` : '';

            document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') setUsername(); });

            // ✅ Un solo listener para todo el nodo config (ahorra 2 lecturas en tiempo real)
            let chatTTL = null;

            function loadTicker(texto) {
                const bar = document.getElementById('tickerBar');

                if (texto && texto.trim()) {

            // ── Avisos programados: cálculo LOCAL (no depende de que admin.html esté abierto) ──
            // Replica la lógica de updateActiveAviso() de admin.html, pero corre en el navegador
            // de cualquier usuario que tenga el chat abierto, así el aviso se activa/desactiva solo.
            window._avisosSchedule = null; // datos crudos de config/avisos (5 slots)
            window._legacyAvisoText = '';  // fallback: texto ya calculado en config/aviso (compatibilidad)
            window._currentAvisoText = '';

            function computeActiveAvisoText(avisosData) {
                if (!avisosData) return null; // null = "no hay datos nuevos, usar fallback"
                const now = new Date();
                const activeTexts = [];
                for (let i = 0; i < 5; i++) {
                    const slot = avisosData[`slot${i}`];
                    if (slot && slot.enabled && slot.text && slot.start && slot.end) {
                        const start = new Date(slot.start);
                        const end = new Date(slot.end);
                        if (now >= start && now <= end) {
                            activeTexts.push(slot.text);
                        }
                    }
                }
                return activeTexts.join('   •••   ');
            }

}

        // ═══════════════════════════════════════════════════════════

        // escapeHtml propia para este bloque: la de initChat() vive en su
        // propio closure y no es visible aquí (openNotificationsModal está
        // fuera de initChat, a nivel de módulo).
        function escapeHtmlNotif(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        // Historial local persistente: separado de lo que hay en Firebase.
        // Firebase solo se usa como "buzón de entrada" temporal; una vez
        // leída, se limpia del servidor, pero la copia local se conserva
        // para poder verla después.
        const NOTIF_STORAGE_KEY = 'notificaciones_historial';

        function getNotifHistorial() {
            try { return JSON.parse(localStorage.getItem(NOTIF_STORAGE_KEY) || '[]'); }
            catch(e) { return []; }
        }

        function saveNotifHistorial(historial) {
            localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(historial));
        }

        function updateNotificationsBadge() {
            const historial = getNotifHistorial();
            const unread = historial.filter(n => !n.read).length;
            const badge = document.getElementById('notificationsBadge');
            if (unread > 0) {
                badge.textContent = unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Escucha en tiempo real: si llega una notificación nueva mientras el
        // chat ya está abierto, se refleja al instante (antes solo se leía
        // una vez con get(), al conectar, así que las notificaciones enviadas
        // después nunca se veían hasta recargar la página).
        // Las notificaciones que llegan se fusionan al historial local (no
        // se sobrescribe), así que aunque luego se borren del servidor,
        // siguen disponibles para verlas después.
        function loadNotificationsFromFirebase(uid) {
            try {
                onValue(ref(database, `notifications/${uid}`), (snap) => {
                    const historial = getNotifHistorial();
                    const idsExistentes = new Set(historial.map(n => n.id));
                    let huboNuevas = false;

                    if (snap.exists()) {
                        snap.forEach(childSnap => {
                            if (!idsExistentes.has(childSnap.key)) {
                                historial.push({
                                    id: childSnap.key,
                                    read: false,
                                    ...childSnap.val()
                                });
                                huboNuevas = true;
                            }
                        });
                    }

                    if (huboNuevas) saveNotifHistorial(historial);
                    updateNotificationsBadge();
                });
            } catch(e) {
                console.warn('Error escuchando notificaciones:', e);
            }
        }

        // Limpia el buzón en Firebase (ya se fusionó al historial local) y
        // marca todo el historial local como leído.
        async function markNotificationsAsRead(uid) {
            try {
                await remove(ref(database, `notifications/${uid}`));
                await update(ref(database, `users/${uid}`), { hasNewNotifications: false });
            } catch(e) {
                console.warn('Error marcando notificaciones como leídas:', e);
            }
            const historial = getNotifHistorial().map(n => ({ ...n, read: true }));
            saveNotifHistorial(historial);
            updateNotificationsBadge();
        }

        window.openNotificationsModal = function() {
            const historial = [...getNotifHistorial()].reverse(); // más recientes primero
            const list = document.getElementById('notificationsList');

            if (historial.length === 0) {
                list.innerHTML = '<div class="notifications-empty">Sin notificaciones</div>';
            } else {
                list.innerHTML = historial.map(n => `
                    <div class="notification-item">
                        <div>
                            <div class="notification-content">${escapeHtmlNotif(n.message || '')}</div>
                            <div class="notification-date">${new Date(n.timestamp || Date.now()).toLocaleDateString()} ${new Date(n.timestamp || Date.now()).toLocaleTimeString()}</div>
                        </div>
                        <button class="notification-delete" onclick="deleteNotification('${n.id}')" title="Eliminar">🗑️</button>
                    </div>
                `).join('');
            }

            if (window._notifUid) {
                markNotificationsAsRead(window._notifUid);
            }

            document.getElementById('notificationsModal').classList.add('visible');
        };

        window.closeNotificationsModal = function() {
            document.getElementById('notificationsModal').classList.remove('visible');
        };

        window.deleteNotification = function(id) {
            const historial = getNotifHistorial().filter(n => n.id !== id);
            saveNotifHistorial(historial);
            updateNotificationsBadge();
            window.openNotificationsModal(); // Recargar lista
        };

        // Nota: loadNotificationsFromFirebase(uid) ahora se llama directamente
        // dentro de initChat() (ver arriba), ya que sobreescribir
        // window.initChat aquí no interceptaba las llamadas a initChat(...)
        // hechas dentro del mismo módulo (esas usan el enlace léxico local,
        // no la propiedad de window).
    </script>

    <script>
        var audioCtx = null;
        var soundMuted = false;
        try { soundMuted = localStorage.getItem('chat-muted') === 'true'; } catch(e) {}

        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.removeEventListener('touchstart', initAudioCtx);
                document.removeEventListener('click', initAudioCtx);
                document.removeEventListener('keydown', initAudioCtx);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
        }

        document.addEventListener('touchstart', initAudioCtx, { passive: true });
        document.addEventListener('click', initAudioCtx, { passive: true });
        document.addEventListener('keydown', initAudioCtx, { passive: true });

        function playPopSound() {
            if (soundMuted || !audioCtx || audioCtx.state === 'suspended') return;
            try {
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }
        window.playPopSound = playPopSound;

        function toggleMute() {
            soundMuted = !soundMuted;
            try { localStorage.setItem('chat-muted', soundMuted ? 'true' : 'false'); } catch(e) {}
            var btn = document.getElementById('btnMute');
            if (btn) {
                btn.textContent = soundMuted ? '🔕' : '🔔';
                btn.className = soundMuted ? 'btn-mute muted' : 'btn-mute';
                btn.title = soundMuted ? 'Activar sonido' : 'Silenciar notificaciones';
            }
        }

        // ✅ Cerrar chat — avisa al padre si está en iframe, o cierra la ventana
        function closeChatFromInside() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_CHAT' }, '*');
            } else {
                window.close();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('btnMute');
            if (btn && soundMuted) {
                btn.textContent = '🔕';
                btn.className = 'btn-mute muted';
                btn.title = 'Activar sonido';
            }
        });
    </script>

<script>
/* ANTI-TECLADO MÓVIL (iOS/Android):
   - Evita que el navegador abra teclado al cargar (focus restaurado / autofoco raro)
   - Pone inputs en readonly hasta que el usuario toque el campo
*/
(function () {
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouch) return;

  function arm(input) {
    if (!input) return;

    // Evita teclado aunque el navegador intente enfocar
    input.setAttribute('readonly', 'readonly');
    input.blur();

    // Si algo lo enfoca, lo desenfocamos mientras siga readonly
    input.addEventListener('focus', () => {
      if (input.hasAttribute('readonly')) {
        input.blur();
      }
    });

    const enable = () => {
      input.removeAttribute('readonly');
      input.focus();
    };

    // Solo habilitar/enfocar con interacción del usuario
    input.addEventListener('touchstart', enable, { once: true, passive: true });
    input.addEventListener('click', enable, { once: true, passive: true });
  }

  function run() {
    arm(document.getElementById('messageInput'));

        setTimeout(() => {
            const startTime = Date.now();
            const animTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / AUTO_DELETE_MS, 1);
                const pct = (1 - progress) * 100;
                timerFill.style.width = pct + '%';
                timerMarker.style.left = pct + '%';
                if (progress >= 1) clearInterval(animTimer);
            }, 100);
        }, 200);

        // ── Efecto Typewriter ──
        const textEl = div.querySelector('.message-text');
        if (textEl) {
            const fullHTML = textEl.innerHTML;
            textEl.innerHTML = '';
            textEl.style.visibility = 'visible';

            // Extraer texto plano preservando tags HTML
            const temp = document.createElement('div');
            temp.innerHTML = fullHTML;

            // Función para animar nodo por nodo
            function typeNode(node, parent, onDone) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const chars = node.textContent.split('');
                    let i = 0;
                    const span = document.createTextNode('');
                    parent.appendChild(span);
                    const interval = setInterval(() => {
                        span.textContent += chars[i++];
                        container.scrollTop = container.scrollHeight;
                        if (i >= chars.length) { clearInterval(interval); onDone(); }
                    }, typeSpeed || 18);
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    const clone = document.createElement(node.tagName);
                    Array.from(node.attributes).forEach(a => clone.setAttribute(a.name, a.value));
                    parent.appendChild(clone);
                    typeChildren(Array.from(node.childNodes), clone, onDone);
                } else {
                    onDone();
                }
            }

            function typeChildren(nodes, parent, onDone) {
                if (!nodes.length) { onDone(); return; }
                const [first, ...rest] = nodes;
                typeNode(first, parent, () => typeChildren(rest, parent, onDone));
            }

            typeChildren(Array.from(temp.childNodes), textEl, () => {
                container.scrollTop = container.scrollHeight;
            });
        }

        // Auto-borrar después de 3 minutos
        setTimeout(() => {
            if (div && div.parentNode) {
                div.style.transition = 'opacity 0.5s ease';
                div.style.opacity = '0';
                setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 500);

                    zonaActual = { tipo: 'subida', tope: z.tope, salto: z.salto };

                    faltanParaSalto = z.salto - total;

    function getDatosUsuario() {
        try {
            const raw = localStorage.getItem('atlas-earth-calc-data');
            return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
    }

    function responderDatosPerfil(tipo) {
        const data = getDatosUsuario();
        if (!data) {
            addAuraMessage('No encontré datos de tu perfil, Explorador. Visita la sección principal e ingresa tus datos primero.');
            return;
        }

        const common    = parseInt(data.common    || 0, 10);
        const rare      = parseInt(data.rare      || 0, 10);
        const epic      = parseInt(data.epic      || 0, 10);
        const legendary = parseInt(data.legendary || 0, 10);
        const badges    = parseInt(data.badges    || 0, 10);
        const ab        = parseFloat(data.atlasbucks || 0);
        const total     = common + rare + epic + legendary;
        const abParcelas = Math.floor(ab / 100);

        const BONOS = [
            { min: 1,   max: 10,  bono: 5  },
            { min: 11,  max: 30,  bono: 10 },
            { min: 31,  max: 60,  bono: 15 },
            { min: 61,  max: 100, bono: 20 },
            { min: 101, max: 9999,bono: 25 },
        ];

        let msg = '';

        if (tipo === 'total') {
            msg = '🗺️ Tienes <strong>' + total + ' parcelas</strong> en total.';

        } else if (tipo === 'comunes') {
            msg = '🟢 Tienes <strong>' + common + ' parcelas comunes</strong>.';

        } else if (tipo === 'raras') {
            msg = '🔵 Tienes <strong>' + rare + ' parcelas raras</strong>.';

        } else if (tipo === 'epicas') {
            msg = '🟣 Tienes <strong>' + epic + ' parcelas épicas</strong>.';

        } else if (tipo === 'legendarias') {
            msg = '🟡 Tienes <strong>' + legendary + ' parcelas legendarias</strong>.';

        } else if (tipo === 'faltan_salto') {
            if (total >= 455) {
                msg = '🎉 Ya estás en <strong>zona libre</strong>. No tienes un siguiente salto, ¡cada parcela que compres solo suma!';
            } else {
                let faltanParaSalto = 0;
                for (let i = 0; i < SALTOS_MX.length; i++) {
                    const z = SALTOS_MX[i];
                    const prevSalto = i === 0 ? 0 : SALTOS_MX[i-1].salto;
                    if ((total >= prevSalto && total < z.tope) || total === z.tope || (total > z.tope && total < z.salto)) {
                        faltanParaSalto = (total < z.tope ? z.tope : z.salto) - total;
                        break;
                    }
                }
                if (!faltanParaSalto) faltanParaSalto = 455 - total;
                msg = '📈 Te faltan <strong>' + faltanParaSalto + ' parcelas</strong> para el siguiente salto.';
            }

        } else if (tipo === 'ab') {
            msg = '💰 Tienes <strong>' + ab.toLocaleString() + ' Atlas Bucks</strong>.';

        } else if (tipo === 'comprar_parcelas') {
            msg = '🛒 Con tus <strong>' + ab.toLocaleString() + ' AB</strong> puedes comprar <strong>' + abParcelas + ' parcelas</strong>.';

        } else if (tipo === 'alcanzan_ab') {
            if (total >= 455) {
                msg = '✅ Ya estás en zona libre. Puedes comprar <strong>' + abParcelas + ' parcelas</strong> con tus AB actuales.';
            } else {
                let faltanParaSalto = 0;
                for (let i = 0; i < SALTOS_MX.length; i++) {
                    const z = SALTOS_MX[i];
                    const prevSalto = i === 0 ? 0 : SALTOS_MX[i-1].salto;
                    if ((total >= prevSalto && total < z.tope) || total === z.tope || (total > z.tope && total < z.salto)) {
                        faltanParaSalto = (total < z.tope ? z.tope : z.salto) - total;
                        break;
                    }
                }
                if (!faltanParaSalto) faltanParaSalto = 455 - total;
                const abNecesarios = faltanParaSalto * 100;
                if (ab >= abNecesarios) {
                    msg = '✅ ¡Sí te alcanzan! Necesitas <strong>' + abNecesarios.toLocaleString() + ' AB</strong> para el siguiente salto y tienes <strong>' + ab.toLocaleString() + ' AB</strong>. ¡Es momento de comprar!';
                } else {
                    msg = '❌ Aún no te alcanzan. Necesitas <strong>' + abNecesarios.toLocaleString() + ' AB</strong> para el siguiente salto y tienes <strong>' + ab.toLocaleString() + ' AB</strong>. Te faltan <strong>' + (abNecesarios - ab).toLocaleString() + ' AB</strong>.';
                }
            }

        } else if (tipo === 'insignias') {
            msg = '🏅 Tienes <strong>' + badges + ' insignias</strong>.';

        } else if (tipo === 'pct_renta') {
            const tramo = BONOS.find(t => badges >= t.min && badges <= t.max) || (badges === 0 ? { bono: 0 } : BONOS[BONOS.length-1]);
            msg = '📊 Tu % de renta actual es <strong>+' + tramo.bono + '%</strong> con ' + badges + ' insignias.';

        } else if (tipo === 'faltan_pct') {
            const tramoActual = BONOS.find(t => badges >= t.min && badges <= t.max) || BONOS[0];
            const idxActual = BONOS.indexOf(tramoActual);
            const tramoSig = BONOS[idxActual + 1];
            if (!tramoSig || badges >= 101) {
                msg = '🏆 Ya tienes el <strong>% máximo de renta (+25%)</strong>. ¡Felicidades Explorador!';
            } else {
                const faltan = tramoSig.min - badges;
                msg = '🏅 Te faltan <strong>' + faltan + ' insignias</strong> para pasar de <strong>+' + tramoActual.bono + '%</strong> a <strong>+' + tramoSig.bono + '%</strong> de renta.';
            }

        } else if (tipo === 'faltan_umbral') {
            if (total >= 455) {
                msg = '🎉 ¡Ya estás <strong>sobre el umbral</strong>, <strong>' + total + ' parcelas</strong>! Estás en zona libre, cada parcela que compres solo suma. ¡Felicidades! 🚀';
            } else {
                const faltanUmbral = 455 - total;
                const abNecesarios = faltanUmbral * 100;
                const tieneAB = ab >= abNecesarios;
                msg = '🎯 Te faltan <strong>' + faltanUmbral + ' parcelas</strong> para llegar al umbral (455).<br>' +
                      'Necesitas <strong>' + abNecesarios.toLocaleString() + ' AB</strong> para comprarlas.' +
                      (tieneAB ? '<br><br>✅ ¡Ya tienes suficientes AB para lograrlo! Es momento de comprar 🚀' : '<br><br>💰 Actualmente tienes <strong>' + ab.toLocaleString() + ' AB</strong>, te faltan <strong>' + (abNecesarios - ab).toLocaleString() + ' AB</strong> para completarlo.');
            }

        } else if (tipo === 'ab_pct') {
            const tramoActual = BONOS.find(t => badges >= t.min && badges <= t.max) || BONOS[0];
            const idxActual = BONOS.indexOf(tramoActual);
            const tramoSig = BONOS[idxActual + 1];
            if (!tramoSig || badges >= 101) {
                msg = '🏆 Ya tienes el <strong>% máximo de renta (+25%)</strong>. No necesitas más insignias.';
            } else {
                const faltan = tramoSig.min - badges;
                const abNecesarios = faltan * 200;
                msg = '💰 Necesitas <strong>' + abNecesarios.toLocaleString() + ' AB</strong> para comprar <strong>' + faltan + ' insignias</strong> y subir a <strong>+' + tramoSig.bono + '%</strong> de renta.';
            }
        }

        const _d = 1000 + Math.floor(Math.random() * 1500); setTimeout(() => { addAuraMessage(msg); }, _d);
    }

    window._auraCheckMessage = function(text, isOwn) {
        if (!isOwn) return;
        // Solo responder si el mensaje menciona @aura
        if (!text.toLowerCase().includes('@aura')) return;
        const now = Date.now();
        const lower = ' ' + text.toLowerCase() + ' ';

<script>
/* ── TOOLTIP TOUR ── */
(function() {
    const TOUR = [
        { selector: 'a.btn-guias[href*="helpshift"]', text: 'Soporte técnico' },
        { selector: '#btnVisor',                       text: 'Visor HUD' },
        { selector: '#btnVisorCartas',                  text: 'Visor de Cartas' },
        { selector: 'a.btn-leaderboard',               text: 'Ranking' },
        { selector: 'a.btn-guias[href="guias.html"]',  text: 'Guías' },
        { selector: '#btnTransacciones',               text: 'Coins' },
        { selector: '#btnMarco',                       text: 'Marco AEMX' },
        { selector: '#btnNotifications',                text: 'Notificaciones' },
        { selector: '#btnMute',                        text: 'Sonido' },
        { selector: '.btn-close-chat',                 text: 'Cerrar' },
    ];

    const DURATION = 2500;
    const FADE     = 350;

    let tip, current = 0, timer;

    function createTip() {
        tip = document.createElement('div');
        tip.className = 'btn-tooltip';
        document.body.appendChild(tip);
    }

    function visibleTargets() {
        return TOUR.filter(t => {
            const el = document.querySelector(t.selector);
            if (!el) return false;
            const style = window.getComputedStyle(el);
            return style.display !== 'none' && style.visibility !== 'hidden' && el.offsetParent !== null;
        });
    }

    function showNext() {
        const targets = visibleTargets();
        if (!targets.length) { timer = setTimeout(showNext, 3000); return; }

        current = current % targets.length;
        const { selector, text } = targets[current];
        const el = document.querySelector(selector);
        const rect = el.getBoundingClientRect();

        tip.textContent = text;
        tip.classList.remove('visible');

        // Posicionar debajo del botón
        const tipW = tip.offsetWidth || 120;
        let left = rect.left + rect.width / 2 - tipW / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - tipW - 8));
        tip.style.left = left + 'px';
        tip.style.top  = (rect.bottom + 8) + 'px';

        // Ajustar flecha al centro del botón
        const arrowLeft = (rect.left + rect.width / 2) - left;
        tip.style.setProperty('--arrow-left', arrowLeft + 'px');

        requestAnimationFrame(() => { tip.classList.add('visible'); });

        timer = setTimeout(() => {
            tip.classList.remove('visible');
            current++;
            timer = setTimeout(showNext, FADE);
        }, DURATION);
    }

    // Soporte para flecha dinámica vía CSS variable
    const styleArrow = document.createElement('style');
    styleArrow.textContent = '.btn-tooltip::before { left: var(--arrow-left, 50%); transform: translateX(-50%); }';
    document.head.appendChild(styleArrow);

    document.addEventListener('DOMContentLoaded', function() {
        createTip();
        timer = setTimeout(showNext, 1500);
    });
})();
</script>
