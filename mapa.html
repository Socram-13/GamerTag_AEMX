<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="imagen_1.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAPA · ATLAS EARTH AEMX</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <style>
    :root {
      --bg:        #060b14;
      --panel:     #0b1626;
      --panel2:    #0f1e35;
      --border:    #1a3a5c;
      --glow:      #00c8ff;
      --glow2:     #00ff9d;
      --gold:      #ffd700;
      --epic:      #c084fc;
      --rare:      #60a5fa;
      --common:    #4ade80;
      --legendary: #facc15;
      --text:      #cce4ff;
      --text2:     #6b8ab0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    body::after {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(0,200,255,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(0,255,157,0.04) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── HEADER ── */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #0b1f3a 0%, #060f1e 100%);
      border: 3px solid var(--border);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .header-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00c8ff, #4ade80, #facc15, #c084fc, #00c8ff);
      background-size: 200% 100%;
      animation: rainbowSlide 6s linear infinite;
    }
    @keyframes rainbowSlide {
      0%   { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }
    .header-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(14px, 3vw, 24px);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--glow);
      text-shadow: 0 0 20px rgba(0,200,255,0.5);
    }
    .header-title span { color: var(--legendary); }
    .header-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn:hover { border-color: var(--glow); color: var(--glow); }
    .nav-btn.active { border-color: var(--glow); color: var(--glow); background: rgba(0,200,255,0.08); }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      flex: 1;
      min-width: 120px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--glow); }
    .stat-num {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      color: var(--glow);
      text-shadow: 0 0 12px rgba(0,200,255,0.4);
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text2);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── MAP CONTAINER ── */
    .map-wrap {
      background: var(--panel);
      border: 3px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .map-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--glow), transparent);
      z-index: 10;
    }
    #map {
      height: 580px;
      width: 100%;
      background: #060b14 !important;
    }

    /* ── Leaflet overrides ── */
    .leaflet-container {
      background: #060b14 !important;
      font-family: 'Rajdhani', sans-serif;
    }
    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--glow) !important;
      border-color: var(--border) !important;
      font-weight: 700;
    }
    .leaflet-control-zoom a:hover {
      background: var(--panel2) !important;
      color: #fff !important;
    }
    .leaflet-control-attribution {
      background: rgba(6,11,20,0.8) !important;
      color: var(--text2) !important;
      font-size: 9px;
    }
    .leaflet-control-attribution a { color: var(--glow) !important; }

    /* ── Popup custom ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--glow) !important;
      border-radius: 10px !important;
      box-shadow: 0 0 20px rgba(0,200,255,0.3) !important;
      color: var(--text) !important;
      font-family: 'Rajdhani', sans-serif !important;
    }
    .leaflet-popup-tip { background: var(--panel) !important; }
    .leaflet-popup-close-button { color: var(--text2) !important; font-size: 16px !important; }
    .leaflet-popup-close-button:hover { color: var(--glow) !important; }

    .popup-player {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .popup-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--glow);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .popup-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .popup-name {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--glow);
    }
    .popup-total {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--text2);
    }
    .popup-state-title {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--legendary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .popup-count {
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 1px;
    }

    /* ── LEYENDA ── */
    .legend {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .legend-title {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--text2);
      text-transform: uppercase;
      margin-right: 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
    }
    .legend-box {
      width: 16px; height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
    }



    /* ── TOOLTIP estado ── */
    .leaflet-tooltip {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      color: var(--text2) !important;
      font-family: 'Orbitron', monospace !important;
      font-size: 9px !important;
      letter-spacing: 2px !important;
      border-radius: 6px !important;
      box-shadow: 0 0 10px rgba(0,200,255,0.2) !important;
    }

    /* ── loading ── */
    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 5;
      background: rgba(6,11,20,0.7);
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .map-loading.hidden { opacity: 0; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--glow);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--glow);
    }

    @media (max-width: 600px) {
      #map { height: 420px; }
      .stats-bar { gap: 6px; }
      .stat-num { font-size: 18px; }
    }

    /* ── ZOOM SLIDER ── */
    .zoom-slider-wrap {
      position: absolute;
      right: 14px;
      bottom: 36px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      box-shadow: 0 0 16px rgba(0,200,255,0.15);
    }
    .zoom-slider-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--glow);
      letter-spacing: 1px;
    }
    .zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      writing-mode: vertical-lr;
      direction: rtl;
      width: 4px;
      height: 120px;
      background: var(--border);
      outline: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
      border: 2px solid #fff;
    }
    .zoom-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
      border: 2px solid #fff;
    }
    .zoom-btn-sm {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--glow);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
    }
    .zoom-btn-sm:hover { border-color: var(--glow); background: rgba(0,200,255,0.1); }

    /* ── FULLSCREEN BTN ── */
    .fullscreen-btn {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 999;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(0,200,255,0.1);
    }
    .fullscreen-btn:hover { border-color: var(--glow); color: var(--glow); }
    .fullscreen-btn svg { width: 13px; height: 13px; }

    /* Fullscreen mode */
    .map-wrap.is-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 9999 !important;
    }
    .map-wrap.is-fullscreen #map {
      height: 100vh !important;
    }

    /* ── PANEL MUNICIPIOS ── */
    .municipios-panel {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 14px;
      position: relative;
      overflow: hidden;
    }
    .municipios-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff4d4d, transparent);
    }
    .municipios-title {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ff4d4d;
      text-shadow: 0 0 10px rgba(255,77,77,0.4);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .municipios-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .municipios-input {
      flex: 1;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .municipios-input:focus { border-color: #ff4d4d; }
    .municipios-input::placeholder { color: var(--text2); }
    .municipios-add-btn {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #ff4d4d;
      background: rgba(255,77,77,0.1);
      color: #ff4d4d;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .municipios-add-btn:hover { background: rgba(255,77,77,0.2); box-shadow: 0 0 10px rgba(255,77,77,0.3); }
    .municipios-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .municipios-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
    }
    .municipio-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,77,77,0.1);
      border: 1px solid rgba(255,77,77,0.4);
      border-radius: 20px;
      padding: 4px 12px 4px 10px;
      font-size: 12px;
      color: #ff9999;
      transition: all 0.2s;
    }
    .municipio-tag:hover { border-color: #ff4d4d; }
    .municipio-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 6px #ff4d4d;
      flex-shrink: 0;
    }
    .municipio-dot.loading {
      background: var(--text2);
      box-shadow: none;
      animation: pulse-dot 1s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 0.3; } 50% { opacity: 1; }
    }
    .municipio-del {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      transition: color 0.2s;
      margin-left: 2px;
    }
    .municipio-del:hover { color: #ff4d4d; }
    /* ── TOGGLE LAYER BUTTONS ── */
    .toggle-layer-btn {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toggle-layer-btn.active {
      border-color: var(--glow);
      color: var(--glow);
      background: rgba(0,200,255,0.08);
    }
    .toggle-layer-btn.active#toggleMunicipios {
      border-color: #ff4d4d;
      color: #ff4d4d;
      background: rgba(255,77,77,0.08);
    }
    .toggle-layer-btn:hover { opacity: 0.8; }

    .municipios-empty {
      color: var(--text2);
      font-size: 12px;
      font-style: italic;
    }
    .municipio-suggestions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: var(--panel2);
      border: 1px solid #ff4d4d;
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 99999;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .suggestion-item {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: rgba(255,77,77,0.15); color: #ff9999; }
  </style>
</head>
<body>

<!-- Sin auth overlay — acceso solo desde admin.html -->

<div class="container">

  <!-- Header -->
  <header>
    <div class="header-bar">
      <div class="header-title">🗺️ MAPA <span>AEMX</span></div>
      <nav class="header-nav">
        <a href="index.html"       class="nav-btn">CALCULADORA</a>
        <a href="leaderboard.html" class="nav-btn">RANKING</a>
        <a href="admin.html"       class="nav-btn">⚙️ ADMIN</a>
      </nav>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-num" id="statJugadores">—</div>
      <div class="stat-label">Jugadores</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statEstados">—</div>
      <div class="stat-label">Estados</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statCiudades">—</div>
      <div class="stat-label">Ciudades</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAemx" style="color:var(--glow2);text-shadow:0 0 12px rgba(0,255,157,0.5);">—</div>
      <div class="stat-label">Miembros AEMX</div>
    </div>
  </div>

  <!-- Mapa -->
  <div class="map-wrap" id="mapWrap">
    <div class="map-loading" id="mapLoading">
      <div class="spinner"></div>
      <div class="loading-text">CARGANDO MAPA...</div>
    </div>
    <div id="map"></div>

    <!-- Botón pantalla completa -->
    <button class="fullscreen-btn" id="fullscreenBtn" title="Pantalla completa">
      <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
      FULLSCREEN
    </button>

    <!-- Slider de zoom -->
    <div class="zoom-slider-wrap" id="zoomSliderWrap">
      <span class="zoom-slider-label" id="zoomLevel">Z5</span>
      <button class="zoom-btn-sm" id="zoomIn">+</button>
      <input type="range" class="zoom-slider" id="zoomSlider" min="0" max="19" step="1" value="5">
      <button class="zoom-btn-sm" id="zoomOut">−</button>
    </div>
  </div>

  <!-- Leyenda -->
  <div class="legend">
    <span class="legend-title">Jugadores por estado</span>
    <div class="legend-item"><div class="legend-box" style="background:rgba(0,200,255,0.15)"></div> 1 jugador</div>
    <div class="legend-item"><div class="legend-box" style="background:rgba(0,200,255,0.35)"></div> 2–4</div>
    <div class="legend-item"><div class="legend-box" style="background:rgba(0,200,255,0.55)"></div> 5–9</div>
    <div class="legend-item"><div class="legend-box" style="background:rgba(0,200,255,0.70)"></div> 10+</div>
    <div class="legend-item"><div class="legend-box" style="background:rgba(0,255,157,0.65);border-color:#00ff9d;"></div> Con miembro AEMX</div>
    <div class="legend-item" style="margin-left:auto">
      <div style="width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow)"></div>
      Jugador
    </div>
    <div style="margin-left:12px;display:flex;gap:8px;">
      <button class="toggle-layer-btn active" id="toggleJugadores" title="Mostrar/ocultar jugadores">
        👤 JUGADORES
      </button>
      <button class="toggle-layer-btn active" id="toggleMunicipios" title="Mostrar/ocultar municipios">
        📍 MUNICIPIOS
      </button>
    </div>
  </div>

  <!-- Panel Municipios -->
  <div class="municipios-panel">
    <div class="municipios-title">📍 MUNICIPIOS DE INTERÉS</div>
    <div class="municipios-input-row" style="position:relative;">
      <div style="flex:1;position:relative;">
        <input type="text" class="municipios-input" id="municipioInput" placeholder="Ej: Mérida, Valladolid, Tizimín..." autocomplete="off">

  // ── Mapa ciudad → estado (para jugadores sin estado exacto) ──

  // Coordenadas de capitales de estados para colorear el centroide
  const ESTADO_COORDS = {

  // Color según cantidad de jugadores
  function colorEstado(n) {
    if (n >= 10) return 'rgba(0,255,157,0.60)';
    if (n >= 5)  return 'rgba(0,200,255,0.55)';
    if (n >= 2)  return 'rgba(0,200,255,0.35)';
    return                'rgba(0,200,255,0.15)';
  }
  function borderEstado(n) {
    if (n >= 10) return '#00ff9d';
    if (n >= 5)  return '#00c8ff';
    if (n >= 2)  return '#1a6a9c';
    return                '#1a3a5c';
  }

  // Avatar HTML
  function avatarHTML(p, size = 32) {
    const letter = (p.username || '?').charAt(0).toUpperCase();
    const colors = ['#00c8ff','#00ff9d','#c084fc','#60a5fa','#facc15','#4ade80','#f472b6'];
    const bg = colors[letter.charCodeAt(0) % colors.length];
    const border = p.borderColor || bg;
    return `<div class="popup-avatar" style="background:${bg};border-color:${border};width:${size}px;height:${size}px">${letter}</div>`;
  }

  // Extraer estado de city string "Ciudad, Estado"
  function extractEstado(city) {
    if (!city) return null;
    const parts = city.split(',');
    if (parts.length >= 2) return parts[parts.length - 1].trim();
    // Intentar mapeo directo por ciudad
    const lower = city.toLowerCase().trim();
    return CIUDAD_ESTADO[lower] || null;
  }

  // Icono marcador personalizado
  function makeMarker(p) {
    const letter = (p.username || '?').charAt(0).toUpperCase();
    const colors = ['#00c8ff','#00ff9d','#c084fc','#60a5fa','#facc15','#4ade80','#f472b6'];
    const bg = p.borderColor || colors[letter.charCodeAt(0) % colors.length];

    let inner = `<span style="font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:#060b14;">${letter}</span>`;

    const html = `
      <div style="
        width:22px;height:22px;border-radius:50%;
        background:${bg};
        border:2px solid #fff;
        box-shadow:0 0 10px ${bg},0 0 20px ${bg}88;
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;overflow:hidden;
      ">${inner}</div>
      <div style="
        width:0;height:0;

  }

  // ── Capas ──
  let estadoLayers = {};   // estado → L.circle
  let playerMarkers = [];
  let networkLines  = [];  // líneas de ruta
  let geojsonLayer  = null;

  function limpiarMapa() {
    Object.values(estadoLayers).forEach(l => map.removeLayer(l));
    estadoLayers = {};
    playerMarkers.forEach(m => map.removeLayer(m));
    playerMarkers.splice(0); // mutar el mismo array, no reasignar
    networkLines.forEach(l => map.removeLayer(l));
    networkLines = [];
    if (geojsonLayer) { map.removeLayer(geojsonLayer); geojsonLayer = null; }
  }

  function renderRed(players) {
    const con = players.filter(p => p.coords);
    if (con.length < 2) return;

    // Ordenar por proximidad (nearest neighbor): cada punto se une al más cercano no visitado
    function distancia(a, b) {
      const dLat = a.coords[0] - b.coords[0];
      const dLng = a.coords[1] - b.coords[1];
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }

    const visitados = new Array(con.length).fill(false);
    const ordenados = [];
    let actual = 0; // empezar desde el primer jugador
    visitados[actual] = true;
    ordenados.push(con[actual]);

    for (let i = 1; i < con.length; i++) {
      let mejorIdx = -1;
      let mejorDist = Infinity;
      for (let j = 0; j < con.length; j++) {
        if (!visitados[j]) {
          const d = distancia(con[actual], con[j]);
          if (d < mejorDist) { mejorDist = d; mejorIdx = j; }
        }
      }
      visitados[mejorIdx] = true;
      ordenados.push(con[mejorIdx]);
      actual = mejorIdx;
    }

    // Inyectar keyframes de animación una sola vez
    if (!document.getElementById('pulse-style')) {
      const style = document.createElement('style');
      style.id = 'pulse-style';
      style.textContent = `
        @keyframes dashFlow {
          from { stroke-dashoffset: 28; }
          to   { stroke-dashoffset: 0;  }
        }
        @keyframes dashFlowReverse {
          from { stroke-dashoffset: 0;  }
          to   { stroke-dashoffset: 28; }
        }
        .pulse-line {
          animation: dashFlow 1.2s linear infinite;
        }
        .pulse-line-rev {
          animation: dashFlowReverse 1.2s linear infinite;
        }
        @keyframes glowPulse {
          0%,100% { stroke-opacity: 0.15; }
          50%      { stroke-opacity: 0.55; }
        }
        .glow-line {
          animation: glowPulse 1.8s ease-in-out infinite;
        }
      `;
      document.head.appendChild(style);
    }

    // Trazar ruta encadenada
    for (let i = 0; i < ordenados.length - 1; i++) {
      const a = ordenados[i];
      const b = ordenados[i + 1];

      // Progreso → color cambia de cian a púrpura
      const t = i / (ordenados.length - 1);
      const r = Math.round(0   + t * 192);
      const g = Math.round(200 - t * 68);
      const bC= Math.round(255 - t * 123);
      const color = `rgb(${r},${g},${bC})`;

      // ── Capa 1: línea base tenue (glow suave pulsante) ──
      const lineBase = L.polyline([a.coords, b.coords], {
        color,
        weight:    4,
        opacity:   0.12,
        dashArray: null,
        interactive: false,
        className: 'glow-line',
      }).addTo(map);
      networkLines.push(lineBase);

      // ── Capa 2: pulso ida ──
      const linePulse = L.polyline([a.coords, b.coords], {
        color,
        weight:    2,
        opacity:   0.85,
        dashArray: '6, 22',
        interactive: false,
        className: 'pulse-line',
      }).addTo(map);
      networkLines.push(linePulse);

      // ── Capa 3: pulso vuelta (bidireccional) ──
      const linePulseRev = L.polyline([a.coords, b.coords], {
        color,
        weight:    2,
        opacity:   0.55,
        dashArray: '4, 24',
        interactive: false,
        className: 'pulse-line-rev',
      }).addTo(map);
      networkLines.push(linePulseRev);
    }
  }

  async function renderMapa(players) {
    limpiarMapa();

    // Agrupar por estado
    const porEstado = {};
    players.forEach(p => {
      const estado = extractEstado(p.city);
      if (!estado) return;
      if (!porEstado[estado]) porEstado[estado] = [];
      porEstado[estado].push(p);
    });



    // ── Polígonos GeoJSON por estado ──
    const NOMBRE_MAP = {
      'Baja California Norte': 'Baja California',
      'Coahuila de Zaragoza': 'Coahuila',
      'Michoacán de Ocampo': 'Michoacán',
      'Veracruz de Ignacio de la Llave': 'Veracruz',
      'México': 'Estado de México',
    };

    try {
      const geoRes  = await fetch('https://raw.githubusercontent.com/angelnmara/geojson/master/mexicoHigh.json');
      const geoData = await geoRes.json();

      geojsonLayer = L.geoJSON(geoData, {
        style: feature => {
          const rawName = feature.properties.name || feature.properties.NAME_1 || '';
          const nombre  = NOMBRE_MAP[rawName] || rawName;
          const tieneJugadores = !!porEstado[nombre];
          return {
            color:       tieneJugadores ? '#00ff9d' : 'transparent',
            weight:      tieneJugadores ? 1.5        : 0,
            fillColor:   tieneJugadores ? '#00ff9d' : 'transparent',
            fillOpacity: tieneJugadores ? 0.5        : 0,
            opacity:     tieneJugadores ? 0.8        : 0,
          };
        },
        onEachFeature: (feature, layer) => {
          const rawName = feature.properties.name || feature.properties.NAME_1 || '';
          const nombre  = NOMBRE_MAP[rawName] || rawName;
          const jugadores = porEstado[nombre];
          if (!jugadores) return;
          const n = jugadores.length;
          const rows = jugadores.map(p => `
            <div class="popup-player">
              ${avatarHTML(p, 32)}
              <div>
                <div class="popup-name">${p.username}</div>
                <div class="popup-total">${p.total.toLocaleString()} parcelas · ${p.city || nombre}</div>
              </div>
            </div>
          `).join('');
          layer.bindTooltip(`${nombre.toUpperCase()} · ${n} jugador${n > 1 ? 'es' : ''}`, {
            sticky: true, direction: 'top',
          });
          layer.bindPopup(`
            <div style="min-width:200px;max-width:280px;">
              <div class="popup-state-title">📍 ${nombre.toUpperCase()}</div>
              <div class="popup-count">${n} JUGADOR${n > 1 ? 'ES' : ''}</div>
              <div style="margin-top:10px;">${rows}</div>
            </div>
          `);
        },
        interactive: true,
      }).addTo(map);

      // Asegurarse de que los marcadores queden encima
      geojsonLayer.bringToBack();
    } catch(e) {
      console.warn('No se pudo cargar GeoJSON de estados:', e);
    }

    // ── Red de conexiones ──
    renderRed(players);

    // ── Marcadores individuales ──
    players.forEach(p => {
      if (!p.coords) return;
      const marker = L.marker(p.coords, { icon: makeMarker(p) }).addTo(map);
      marker.bindPopup(`
        <div style="min-width:180px;">
          <div class="popup-player">
            ${avatarHTML(p, 40)}
            <div>
              <div class="popup-name">${p.username}</div>
              <div class="popup-total">${p.total.toLocaleString()} parcelas</div>
              <div class="popup-total" style="margin-top:2px;">📍 ${p.city || '<span style="color:#6b8ab0;font-style:italic;">Sin ciudad registrada</span>'}</div>
            </div>
          </div>
        </div>
      `);
      playerMarkers.push(marker);
    });

    // Stats
    const estados  = Object.keys(porEstado).length;
    const ciudades = new Set(players.map(p => p.city).filter(Boolean)).size;
    const aemx     = players.filter(p => p.username.toUpperCase().includes('AEMX')).length;

    document.getElementById('statJugadores').textContent = players.length;
    document.getElementById('statEstados').textContent   = estados;
    document.getElementById('statCiudades').textContent  = ciudades;
    document.getElementById('statAemx').textContent      = aemx;

    // Ocultar loading
    document.getElementById('mapLoading').classList.add('hidden');
  }

  // ── Geocodificación ──
  const CITY_COORDS_CACHE = {};

  // Coords inmediatas desde el estado (sin esperar Nominatim)
  function coordsInstant(city, sinCiudad) {
    if (sinCiudad || !city) {
      const base = [23.6345, -102.5528];
      const jitter = [(Math.random()-0.5)*8, (Math.random()-0.5)*8];
      return [base[0]+jitter[0], base[1]+jitter[1]];
    }
    const estado = extractEstado(city);
    if (estado && ESTADO_COORDS[estado]) {
      const base   = ESTADO_COORDS[estado];
      const jitter = [(Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5];
      return [base[0]+jitter[0], base[1]+jitter[1]];
    }
    // Fallback centro del mundo (jugador sin ciudad reconocida fuera de México)
    const base = [20.0, 0.0];
    const jitter = [(Math.random()-0.5)*40, (Math.random()-0.5)*60];
    return [base[0]+jitter[0], base[1]+jitter[1]];
  }

  // Geocodificación exacta vía proxy CORS (en segundo plano)
  async function geocodeExact(city) {
    if (!city) return null;
    const key = city.toLowerCase().trim();
    if (CITY_COORDS_CACHE[key]) return CITY_COORDS_CACHE[key];
    try {
      const nominatim = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=es`;
      const url = `https://corsproxy.io/?url=${encodeURIComponent(nominatim)}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (data[0]) {
        const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        CITY_COORDS_CACHE[key] = coords;
        return coords;
      }
    } catch(e) {}
    return null;
  }

  // ── Cargar jugadores ──
  async function loadPlayers(currentUid) {
    const usersRef = ref(db, 'users');
    onValue(usersRef, async (snapshot) => {
      document.getElementById('mapLoading').classList.remove('hidden');

      const raw = [];
      snapshot.forEach(child => {
        const d = child.val();
        if (!d.username) return;

        if (d.bannedLeaderboard) return;
        const common    = parseInt(d.common)    || 0;
        const rare      = parseInt(d.rare)      || 0;
        const epic      = parseInt(d.epic)      || 0;
        const legendary = parseInt(d.legendary) || 0;
        raw.push({
          uid:         child.key,
          username:    d.username,
          borderColor: d.borderColor || '',
          city:        d.city        || '',
          total:       common + rare + epic + legendary,
          isYou:       child.key === currentUid,
          sinCiudad:   !d.city,
        });
      });

      // ── Paso 1: asignar coords instantáneas del estado y renderizar YA ──
      raw.forEach(p => {
        p.coords = coordsInstant(p.city, p.sinCiudad);
      });
      renderMapa(raw);

      // ── Paso 2: geocodificar exacto en segundo plano y mover marcadores ──
      const batch = 5;
      for (let i = 0; i < raw.length; i += batch) {
        let algoCambio = false;
        await Promise.all(raw.slice(i, i + batch).map(async (p, idx) => {
          if (p.sinCiudad || !p.city) return;
          const exact = await geocodeExact(p.city);
          if (!exact) return;
          const marker = playerMarkers[raw.indexOf(p)];
          if (marker) {
            marker.setLatLng(exact);
            p.coords = exact;
            algoCambio = true;
          }
        }));
        // Redibujar líneas de red con coords actualizadas
        if (algoCambio) {
          networkLines.forEach(l => map.removeLayer(l));
          networkLines = [];
          renderRed(raw);
        }
        if (i + batch < raw.length) await new Promise(r => setTimeout(r, 300));
      }

      // ── Ajustar la vista para mostrar TODAS las ubicaciones (solo la primera carga) ──
      if (!window._vistaAjustada && playerMarkers.length) {
        window._vistaAjustada = true;
        map.fitBounds(L.featureGroup(playerMarkers).getBounds().pad(0.15), { maxZoom: 6, animate: true });
      }
    });
  }

  // ── Zoom suave con scroll ──
  map.scrollWheelZoom.disable();
  map.getContainer().addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.25 : 0.25;
    const target = Math.max(0, Math.min(19, map.getZoom() + delta));
    map.setZoom(target, { animate: true });
  }, { passive: false });

  // ── Slider de zoom ──
  const zoomSlider  = document.getElementById('zoomSlider');
  const zoomLevelEl = document.getElementById('zoomLevel');
  const zoomInBtn   = document.getElementById('zoomIn');
  const zoomOutBtn  = document.getElementById('zoomOut');

  // Slider con pasos de 0.25
  zoomSlider.min  = 0;
  zoomSlider.max  = 19;
  zoomSlider.step = 0.25;

  function syncSlider() {
    const z = map.getZoom();
    zoomSlider.value = z;
    zoomLevelEl.textContent = `Z${z.toFixed(1)}`;
  }
  map.on('zoom', syncSlider);

  zoomSlider.addEventListener('input', () => {
    map.setZoom(parseFloat(zoomSlider.value), { animate: true });
  });
  zoomInBtn.addEventListener('click', () => {
    map.setZoom(Math.min(19, map.getZoom() + 0.5), { animate: true });
  });
  zoomOutBtn.addEventListener('click', () => {
    map.setZoom(Math.max(0, map.getZoom() - 0.5), { animate: true });
  });

  // ── Pantalla completa ──
  const mapWrap       = document.getElementById('mapWrap');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fsIcon        = document.getElementById('fsIcon');

  const ICON_EXPAND = `
    <polyline points="15 3 21 3 21 9"></polyline>
    <polyline points="9 21 3 21 3 15"></polyline>
    <line x1="21" y1="3" x2="14" y2="10"></line>
    <line x1="3" y1="21" x2="10" y2="14"></line>`;
  const ICON_COLLAPSE = `
    <polyline points="4 14 10 14 10 20"></polyline>
    <polyline points="20 10 14 10 14 4"></polyline>
    <line x1="10" y1="14" x2="3" y2="21"></line>
    <line x1="21" y1="3" x2="14" y2="10"></line>`;

  let isFullscreen = false;

  fullscreenBtn.addEventListener('click', () => {
    isFullscreen = !isFullscreen;
    mapWrap.classList.toggle('is-fullscreen', isFullscreen);
    fsIcon.innerHTML = isFullscreen ? ICON_COLLAPSE : ICON_EXPAND;
    fullscreenBtn.querySelector('span') && (fullscreenBtn.querySelector('span').textContent = isFullscreen ? 'SALIR' : 'FULLSCREEN');
    // Reemplazar texto del botón
    fullscreenBtn.childNodes.forEach(n => { if (n.nodeType === 3) n.textContent = isFullscreen ? ' SALIR' : ' FULLSCREEN'; });
    setTimeout(() => map.invalidateSize(), 200);
  });

  // ESC para salir de fullscreen
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isFullscreen) fullscreenBtn.click();
  });

  // ── Auth — solo acceso desde admin ──
  const ADMIN_EMAIL = 'ingmarcosrodriguez31@gmail.com';

  onAuthStateChanged(auth, user => {
    if (user && user.email === ADMIN_EMAIL) {
      loadPlayers(user.uid);
    } else if (user && user.email !== ADMIN_EMAIL) {
      // Sesión activa pero no es admin
      window.location.href = 'admin.html';
    } else {
      // Sin sesión — redirigir a admin
      window.location.href = 'admin.html';
    }
  });

  // Exponer variables globales para el script de municipios
  window._map           = map;
  window._playerMarkers = playerMarkers;   // misma referencia al array
  window._getGeojson    = () => geojsonLayer;

</script>

<script>
  // ── MUNICIPIOS (script separado, fuera del módulo) ──
  const LS_KEY = 'aemx_municipios';
  const municipioMarkers = {};

  function municipioIcon() {
    const html = `
      <div style="
        width:20px;height:20px;border-radius:50%;
        background:#ff4d4d;
        border:2px solid #fff;
        box-shadow:0 0 10px #ff4d4d,0 0 20px #ff4d4d88;
        display:flex;align-items:center;justify-content:center;
      ">
        <div style="width:6px;height:6px;border-radius:50%;background:#fff;"></div>
      </div>
      <div style="
        width:0;height:0;
        border-left:4px solid transparent;
        border-right:4px solid transparent;
        border-top:5px solid #ff4d4d;
        margin:-1px auto 0;
        filter:drop-shadow(0 2px 4px #ff4d4d88);
      "></div>
    `;
    return L.divIcon({ html, className: '', iconSize: [20, 26], iconAnchor: [10, 26], popupAnchor: [0, -28] });
  }

  function getMunicipios() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch { return []; }
  }

  function saveMunicipios(list) {
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }

  function renderMunicipiosList() {
    const list  = getMunicipios();
    const el    = document.getElementById('municipiosList');
    const empty = document.getElementById('municipiosEmpty');
    [...el.querySelectorAll('.municipio-tag')].forEach(t => t.remove());
    empty.style.display = list.length ? 'none' : '';
    list.forEach(m => {
      const tag = document.createElement('div');
      tag.className = 'municipio-tag';
      tag.innerHTML = `
        <div class="municipio-dot" id="dot-${CSS.escape(m.name)}"></div>
        <span>${m.name}</span>
        <button class="municipio-del" title="Eliminar">×</button>
      `;
      tag.querySelector('.municipio-del').addEventListener('click', () => removeMunicipio(m.name));
      el.appendChild(tag);
    });
  }

  function addMarkerMunicipio(m) {
    if (!m.coords) return;
    const map = window._map;
    if (!map) return;
    if (municipioMarkers[m.name]) map.removeLayer(municipioMarkers[m.name]);
    const marker = L.marker(m.coords, { icon: municipioIcon() }).addTo(map);
    marker.bindPopup(`
      <div style="min-width:160px;">
        <div class="popup-state-title" style="color:#ff4d4d;">📍 ${m.name.toUpperCase()}</div>
        <div class="popup-count">MUNICIPIO DE INTERÉS</div>
      </div>
    `);
    municipioMarkers[m.name] = marker;
  }

  function removeMunicipio(name) {
    const map = window._map;
    if (map && municipioMarkers[name]) map.removeLayer(municipioMarkers[name]);
    delete municipioMarkers[name];
    saveMunicipios(getMunicipios().filter(m => m.name !== name));
    renderMunicipiosList();
  }

  function addMunicipio(name, coords) {
    const trimmed = name.trim();
    if (!trimmed) return;
    const list = getMunicipios();
    if (list.find(m => m.name.toLowerCase() === trimmed.toLowerCase())) return;
    const entry = { name: trimmed, coords };
    list.push(entry);
    saveMunicipios(list);
    renderMunicipiosList();
    addMarkerMunicipio(entry);
  }

  // ── Autocomplete ──
  let selectedSuggestion = null;
  let searchTimer        = null;

  const municipioInput  = document.getElementById('municipioInput');
  const municipioAddBtn = document.getElementById('municipioAddBtn');
  const suggestionsBox  = document.getElementById('municipioSuggestions');

  async function buscarSugerencias(q) {
    if (q.length < 2) { hideSuggestions(); return; }
    try {
      const nominatim = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' Mexico')}&format=json&limit=8&addressdetails=1&accept-language=es&countrycodes=mx`;
      const url = `https://corsproxy.io/?url=${encodeURIComponent(nominatim)}`;
      const res  = await fetch(url);
      if (!res.ok) { hideSuggestions(); return; }
      const data = await res.json();
      if (!data.length) { hideSuggestions(); return; }
      showSuggestions(data);
    } catch(e) {
      console.error('Geocoding error:', e);
      hideSuggestions();
    }
  }

  function showSuggestions(results) {
    suggestionsBox.innerHTML = '';
    let shown = 0;
    results.forEach(r => {
      if (!r.display_name) return;
      const coords = [parseFloat(r.lat), parseFloat(r.lon)];
      // Tomar las primeras 3 partes del display_name para un label limpio
      const parts = r.display_name.split(',').map(s => s.trim()).slice(0, 3);
      const label = parts.join(', ');
      const item  = document.createElement('div');
      item.className = 'suggestion-item';
      item.textContent = label;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        selectedSuggestion = { name: label, coords };
        municipioInput.value = label;
        hideSuggestions();
      });
      suggestionsBox.appendChild(item);
      shown++;
    });
    if (shown > 0) suggestionsBox.style.display = 'block';
    else hideSuggestions();
  }

  function hideSuggestions() {
    suggestionsBox.style.display = 'none';
    suggestionsBox.innerHTML = '';
  }

  municipioInput.addEventListener('input', () => {
    selectedSuggestion = null;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => buscarSugerencias(municipioInput.value), 350);
  });
  municipioInput.addEventListener('blur', () => setTimeout(hideSuggestions, 150));
  municipioInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideSuggestions();
    if (e.key === 'Enter') municipioAddBtn.click();
  });

  municipioAddBtn.addEventListener('click', () => {
    const val = municipioInput.value.trim();
    if (!val) return;
    if (selectedSuggestion) {
      addMunicipio(selectedSuggestion.name, selectedSuggestion.coords);
    } else {
      addMunicipio(val, null);
    }
    municipioInput.value = '';
    selectedSuggestion = null;
    hideSuggestions();
    municipioInput.focus();
  });

  // ── Toggle capas ──
  let jugadoresVisible  = true;
  let municipiosVisible = true;

  document.getElementById('toggleJugadores').addEventListener('click', () => {
    jugadoresVisible = !jugadoresVisible;
    const map = window._map;
    const pm  = window._playerMarkers || [];
    // Ocultar/mostrar marcadores de jugadores
    pm.forEach(m => jugadoresVisible ? m.addTo(map) : map.removeLayer(m));
    // Ocultar/mostrar capa GeoJSON de estados
    const geo = window._getGeojson && window._getGeojson();
    if (geo) jugadoresVisible ? geo.addTo(map) : map.removeLayer(geo);
    document.getElementById('toggleJugadores').classList.toggle('active', jugadoresVisible);
  });

  document.getElementById('toggleMunicipios').addEventListener('click', () => {
    municipiosVisible = !municipiosVisible;
    const map = window._map;
    Object.values(municipioMarkers).forEach(m => municipiosVisible ? m.addTo(map) : map.removeLayer(m));
    document.getElementById('toggleMunicipios').classList.toggle('active', municipiosVisible);
  });

  // Cargar municipios guardados al iniciar (esperar a que el mapa esté listo)
  window.addEventListener('load', () => {
    const tryLoad = () => {
      if (window._map) {
        getMunicipios().forEach(m => addMarkerMunicipio(m));
        renderMunicipiosList();
      } else {
        setTimeout(tryLoad, 300);
      }
    };
    tryLoad();
  });
</script>
</body>
</html>
