<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>X-Files</title>
<style>
:root{--wood:#3b2417;--wood2:#2a190f;--gold:#c9a227}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#1d1d22,#07070a);color:#ddd;font-family:Georgia,serif;overflow-x:hidden}
h1{text-align:center;letter-spacing:.4em;font-weight:400;color:var(--gold);margin:28px 0 4px;text-transform:uppercase}
#msg{text-align:center;font-size:.9rem;opacity:.7;min-height:1.4em}
#room{perspective:1400px;padding:100px 16px 60px;max-width:1100px;margin:auto;min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:flex-end}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;padding:0 24px;min-height:230px;transform:rotateX(4deg);transform-style:preserve-3d;
border-bottom:22px solid var(--wood);box-shadow:0 22px 30px -10px #000;margin-bottom:34px;background:linear-gradient(#0000 70%,#0006)}
.slot{position:relative;width:28px;height:280px;transform-style:preserve-3d;cursor:pointer}
.book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s;transform:rotateY(-14deg)}
.slot:hover{z-index:5}
.slot:hover .book{transform:translateX(var(--tx,70px)) translateZ(110px) translateY(-70px) rotateY(-90deg)}
.spine img{width:22px;height:22px;border-radius:50%;background:#f3e9c8;flex:none}
.cover{flex-direction:column;gap:12px}
.cover img{width:62%;aspect-ratio:1;object-fit:contain;border-radius:50%;background:#f3e9c8;padding:4px}
.face{position:absolute;backface-visibility:hidden;overflow:hidden}
.spine{inset:0;transform:translateZ(var(--d));background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:8px;border:1px solid #0005;box-shadow:inset 0 0 12px #0008}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.05rem;font-weight:bold;color:#f3e9c8;max-height:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
.cover{width:calc(var(--d)*2);height:100%;left:calc(50% - var(--d));top:0;transform-origin:center;transform:rotateY(90deg) translateZ(14px);background:var(--c);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:.95rem;color:#f3e9c8;border:2px solid #0006;box-shadow:inset 0 0 30px #000a}
.side{inset:0;background:#e8dfc4;transform:rotateY(180deg) translateZ(var(--d))}
.book{--d:84px}
/* animacion de apertura */
#stage{position:fixed;inset:0;display:none;perspective:1600px;z-index:10;background:#000c;align-items:center;justify-content:center}
#stage.on{display:flex}
#big{width:300px;height:420px;position:relative;transform-style:preserve-3d;transform:rotateY(-90deg) scale(.3);transition:transform .8s cubic-bezier(.3,.8,.3,1)}
#big.front{transform:rotateY(0) scale(1)}
#big .pg{position:absolute;inset:0;background:#efe6cc;border-radius:2px 8px 8px 2px}
#big .cv{position:absolute;inset:0;transform-origin:left center;transition:transform 1s ease-in-out;background:var(--c);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:1.3rem;color:#f3e9c8;border-radius:2px 8px 8px 2px;border:3px solid #0007;backface-visibility:hidden}
#big .cv{flex-direction:column;gap:22px}
#big .cv img{width:70%;aspect-ratio:1;object-fit:contain;border-radius:50%;background:#f3e9c8;padding:6px;box-shadow:0 0 18px #0009}
#big .cv span{font-size:1.1rem;letter-spacing:.08em;word-break:break-word}
#big.open .cv{transform:rotateY(-170deg)}
#reader{position:fixed;inset:0;z-index:20;background:#101014;display:none;flex-direction:column;opacity:0;transition:opacity .5s}
#reader.on{display:flex}#reader.show{opacity:1}
#bar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#000;border-bottom:1px solid #333}
#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;color:var(--gold)}
button{background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:1rem}
button:hover{background:#333}
#reader{height:100dvh}
#ctrl{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #333}
#ctrl button{min-width:48px;min-height:44px}
#pn{min-width:70px;text-align:center}
#warn{display:none;position:absolute;inset:0;padding:22px 20px;text-align:center;color:#2a1a0f;flex-direction:column;justify-content:center}
#warn.on{display:flex;animation:wFade .6s ease}
@keyframes wFade{from{opacity:0}}
#warn .wt{color:#9b1c1c;letter-spacing:.18em;font-size:.85rem;font-weight:bold;margin:0 0 12px}
#wm{line-height:1.5;font-size:.95rem;margin:0 0 16px}
#warn button{display:block;width:100%;margin-top:8px;min-height:40px;background:#2a1a0f;color:#f3e9c8;border:1px solid #2a1a0f;letter-spacing:.08em}
#warn button:hover{background:#3b2417}
#wno{background:none!important;color:#2a1a0f!important}
#wrap{flex:1;overflow:auto;display:flex;padding:16px;-webkit-overflow-scrolling:touch}
@media(max-width:700px){#wrap{padding:8px}}
canvas{margin:auto;max-width:none;box-shadow:0 0 30px #000;background:#fff;height:fit-content}
#accessOverlay{display:flex;position:fixed;inset:0;z-index:99999;background:rgba(6,11,20,.97);align-items:center;justify-content:center}
.access-box{background:#0b1626;border:1px solid #1a3a5c;border-radius:18px;padding:36px 32px;max-width:360px;width:90%;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 0 60px rgba(0,200,255,.12)}
.access-logo{font-size:22px;font-weight:900;color:#00c8ff;letter-spacing:4px}
.access-logo span{color:var(--gold)}
#accessMsg{font-size:14px;letter-spacing:1px;color:#6b8ab0;text-align:center;line-height:1.6}
#btnLoginGoogle{display:none;border-color:#00c8ff;color:#00c8ff;letter-spacing:2px;padding:12px 22px}
</style>
</head>
<body>
<div id="accessOverlay">
  <div class="access-box">
    <div class="access-logo">AEMX · <span>X-FILES</span></div>
    <p id="accessMsg">Verificando acceso...</p>
    <button id="btnLoginGoogle" onclick="window._googleLogin()">INICIAR CON GOOGLE</button>
  </div>
</div>
<h1>X-Files</h1>
<div id="msg">Cargando…</div>
<div id="room"></div>

<div id="stage">
  <div id="big">
    <div class="pg">
      <div id="warn">
        <p class="wt">⚠ DOCUMENTO CONFIDENCIAL</p>
        <p id="wm">Atención, explorador: lo que está por leer es información reservada. Su contenido es de uso exclusivo del clan AEMX. Lo que lea aquí no debe salir de aquí.</p>
        <button id="wok">ENTENDIDO, ABRIR ARCHIVO</button>
        <button id="wno">VOLVER</button>
      </div>
    </div>
    <div class="cv" id="bigcv"></div>
  </div>
</div>

<div id="reader">
  <div id="bar"><b id="rt"></b><button id="close">✕</button></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="ctrl">
    <button id="prev">◀</button><span id="pn"></span><button id="next">▶</button>
    <button id="zo">−</button><button id="zi">+</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ===== CONFIG (opcional) =====
   Si lo dejas vacío, se detecta solo desde la URL de GitHub Pages. */
const CONFIG = { user:"Socram-13", repo:"GamerTag_AEMX", folder:"pdfs", dir:"", branch:"", cover:"portada.png" };
const PER_SHELF = 14;

pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const colors=["#6b1e1e","#1e3a5f","#2f4f2f","#4a2a5a","#5a4a1e","#1e4f4f","#5a2a2a","#333b52"];

function detect(){
  const h=location.hostname, parts=location.pathname.split("/").filter(Boolean);
  let user=CONFIG.user, repo=CONFIG.repo, dir="";
  if(!user && h.endsWith(".github.io")) user=h.split(".")[0];
  if(!h.endsWith(".github.io")) return {user,repo,path:(CONFIG.dir||"")+CONFIG.folder}; // Cloudflare u otro dominio
  if(!repo){
    if(parts.length>1 || (parts.length===1 && !parts[0].includes("."))) repo=parts[0];
    else repo=h;
  }
  // carpeta donde vive este html dentro del repo
  const segs=parts.slice(); if(segs.length && segs[segs.length-1].includes(".")) segs.pop();
  if(repo!==h && segs[0]===repo) segs.shift();
  dir=segs.length?segs.join("/")+"/":"";
  return {user,repo,path:dir+CONFIG.folder};
}

async function list(){
  const {user,repo,path}=detect();
  if(!user) throw new Error("No se pudo detectar el usuario. Llena CONFIG arriba.");
  let url=`https://api.github.com/repos/${user}/${repo}/contents/${path}`;
  if(CONFIG.branch) url+=`?ref=${CONFIG.branch}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error(`GitHub respondió ${r.status} (¿repo público y carpeta "${path}" existe?)`);
  const data=await r.json();
  return data.filter(f=>/\.pdf$/i.test(f.name)).map(f=>({name:f.name.replace(/\.pdf$/i,""),url:f.download_url||("./"+path.split("/").pop()+"/"+encodeURIComponent(f.name))}));
}

function build(files){
  const room=$("room"); room.innerHTML="";
  for(let i=0;i<files.length;i+=PER_SHELF){
    const s=document.createElement("div"); s.className="shelf";
    files.slice(i,i+PER_SHELF).forEach((f,k)=>{
      const c=colors[(i+k)%colors.length];
      const b=document.createElement("div"); b.className="slot"; b.style.setProperty("--c",c);
      const im=`<img src="${CONFIG.cover}" alt="" onerror="this.remove()">`;
      b.innerHTML=`<div class="book"><div class="face spine">${im}<span>${esc(f.name)}</span></div><div class="face cover">${im}<span>${esc(f.name)}</span></div><div class="face side"></div></div>`;
      b.title=f.name; b.onclick=()=>openBook(f,c);
      b.addEventListener("mouseenter",()=>{
        // alinea el borde izquierdo de la portada con el del libro (no tapa al de la izquierda),
        // compensando la perspectiva según la posición en pantalla
        const rr=$("room").getBoundingClientRect(), sr=b.getBoundingClientRect();
        const dx=sr.left-(rr.left+rr.width/2);
        b.style.setProperty("--tx",(70-dx*110/1400)+"px");
      });
      s.appendChild(b);
    });
    room.appendChild(s);
  }
}
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function openBook(f,c){
  const st=$("stage"),big=$("big"),cv=$("bigcv");
  big.style.setProperty("--c",c); cv.style.setProperty("--c",c);
  cv.innerHTML=`<img src="${CONFIG.cover}" alt="" onerror="this.remove()"><span>${esc(f.name)}</span>`;
  big.classList.remove("front","open"); st.classList.add("on");
  await wait(30); big.classList.add("front");
  await wait(850); big.classList.add("open");
  await wait(700);
  if(await confirmar()){ showReader(f); await wait(550); }
  st.classList.remove("on"); big.classList.remove("front","open");
}
function confirmar(){
  return new Promise(res=>{
    const w=$("warn"); w.classList.add("on");
    const fin=v=>{ w.classList.remove("on"); $("wok").onclick=$("wno").onclick=null; res(v); };
    $("wok").onclick=()=>fin(true); $("wno").onclick=()=>fin(false);
  });
}

let pdf=null,page=1,zoomF=1,rendering=false,pending=null;
async function showReader(f){
  $("rt").textContent=f.name; $("reader").classList.add("on");
  requestAnimationFrame(()=>$("reader").classList.add("show"));
  try{ pdf=await pdfjsLib.getDocument(f.url).promise; page=1; zoomF=1; render(); }
  catch(e){ $("rt").textContent="Error al abrir: "+e.message; }
}
async function render(){
  if(rendering){pending=true;return;} rendering=true;
  try{
    const p=await pdf.getPage(page), dpr=window.devicePixelRatio||1;
    const base=p.getViewport({scale:1}), w=$("wrap");
    const movil=window.innerWidth<700, pad=movil?8:16;
    const fitW=(Math.min(w.clientWidth,window.innerWidth)-pad*2)/base.width;
    const fitH=(w.clientHeight-pad*2)/base.height;
    const fit=movil?fitW:Math.min(fitW,fitH); // móvil: ajusta al ancho; escritorio: a la pantalla completa
    const vp=p.getViewport({scale:fit*zoomF*dpr}), cv=$("cv");
    cv.width=vp.width; cv.height=vp.height; cv.style.width=vp.width/dpr+"px"; cv.style.height=vp.height/dpr+"px";
    await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    $("pn").textContent=` ${page} / ${pdf.numPages} `;
  }catch(e){ $("rt").textContent="Error: "+e.message; }
  rendering=false; if(pending){pending=null;render();}
}
addEventListener("resize",()=>{ if(pdf) render(); });
const go=n=>{ if(!pdf)return; page=Math.min(Math.max(1,page+n),pdf.numPages); render(); $("wrap").scrollTop=0; };
const zoom=z=>{ zoomF=Math.min(4,Math.max(.4,zoomF+z)); render(); };
function closeReader(){ $("reader").classList.remove("show"); setTimeout(()=>{$("reader").classList.remove("on");pdf=null;},400); }
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
$("zi").onclick=()=>zoom(.2); $("zo").onclick=()=>zoom(-.2); $("close").onclick=closeReader;
addEventListener("keydown",e=>{
  if(!$("reader").classList.contains("on"))return;
  if(e.key==="Escape")closeReader();
  if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1);
});

setTimeout(()=>{
  const m=$("accessMsg");
  if(m && m.textContent==="Verificando acceso...") m.textContent="No se pudo verificar el acceso. Abre la página desde tu GitHub Pages (https://), no como archivo local.";
},6000);
window.iniciarXfiles=function(){
  if(window._xfStarted) return; window._xfStarted=true;
  list().then(fs=>{
    if(!fs.length){$("msg").textContent="No hay PDFs en la carpeta.";return;}
    $("msg").textContent=fs.length+" documento(s)"; build(fs);
  }).catch(e=>{$("msg").textContent=e.message;});
};
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyB-xx2PlBjvnHe0K7Bf1MspVqUlfjky0mk",
  authDomain: "aemx-chat.firebaseapp.com",
  databaseURL: "https://aemx-chat-default-rtdb.firebaseio.com",
  projectId: "aemx-chat",
  storageBucket: "aemx-chat.firebasestorage.app",
  messagingSenderId: "267113002594",
  appId: "1:267113002594:web:4099e7537d950f5753433b"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), database=getDatabase(app);
const overlay=document.getElementById('accessOverlay'), msgEl=document.getElementById('accessMsg'), btnLogin=document.getElementById('btnLoginGoogle');
overlay.style.display='flex';

async function verificar(user){
  if(!user){ msgEl.textContent='Debes iniciar sesión para acceder a X-Files.'; btnLogin.style.display='block'; return; }
  try{
    const snap=await get(ref(database,'users/'+user.uid));
    const d=snap.exists()?snap.val():{};
    if(d.clanMember===true||d.role==='admin'||d.role==='moderator'){
      overlay.style.display='none';
      window.iniciarXfiles();
    }else{
      btnLogin.style.display='none';
      msgEl.textContent='⛔ Solo los miembros del clan AEMX pueden acceder a esta página.';
    }
  }catch(e){ msgEl.textContent='⛔ Error al verificar acceso. Intenta de nuevo.'; }
}
onAuthStateChanged(auth,verificar);
window._googleLogin=async function(){
  try{ await signInWithPopup(auth,new GoogleAuthProvider()); }
  catch(e){ msgEl.textContent='Error al iniciar sesión. Intenta de nuevo.'; }
};
</script>
</body>
</html>
